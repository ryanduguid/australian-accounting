[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "aus-accounting-mcp"
version = "0.2.2"
description = "Local accounting reviews, six bounded tax worksheets and cited retrieval from your configured local Markdown folder. uvx from PyPI; not advice."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "model-context-protocol",
    "mcp-server",
    "australian-tax",
    "ato-benchmarks",
    "payday-super",
    "division-7a",
    "accounting-ai",
    "ato",
    "accounting",
    "tax",
]
# PyPI facets. No "License ::" classifier: the SPDX `license` field above is the
# PEP 639 replacement and the two together are rejected. No "Typing :: Typed"
# either, because this distribution ships no py.typed marker; it is a server to
# run, not a library to import against.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=2.1.1,<3",
    # Exact pins, same intent as the commit pins these replace. PyPI rejects a
    # distribution whose metadata carries a direct URL reference, so a git pin
    # here makes the package unpublishable.
    "payday-super-checker==0.1.4",
    "ato-benchmark-compare==0.1.7",
    "div7a-loan-review==0.1.2",
    "australian-tax-calculators==0.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14",
    "build>=1.2",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "Pillow==12.3.0",
    "twine==7.0.0",
    'tomli>=2.0.1; python_version < "3.11"',
]

[project.scripts]
aus-accounting-mcp = "aus_accounting_mcp.cli:main"
aus-accounting-mcp-demo = "aus_accounting_mcp.demo:main"

[project.urls]
Homepage = "https://duguid.com.au/tools/australian-tax-ai-agents/"
Repository = "https://github.com/ryanduguid/australian-accounting.git"

[tool.hatch.build.targets.wheel]
packages = ["aus_accounting_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["aus_accounting_mcp", "tests"]

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, and import sorting. Wider than the
# first-enablement E9/F82 set, and the same shape as the engines' own gates.
# Decimal("10.00") money literals stay: no rule here rewrites a literal.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# Keep an aliased engine import beside its siblings. Without this, sorting
# splits `__version__ as PAYDAY_VERSION` out into a second statement from the
# same module, which is more lines saying less.
combine-as-imports = true
# These are the first-party ones. `src` names source roots, and neither
# directory is the project root, so without this the local imports sort in
# among mcp, pydantic and pytest. `evaluation` is the harness the suite
# imports, and it is this repository's, not a dependency.
known-first-party = ["aus_accounting_mcp", "evaluation"]

[tool.mypy]
python_version = "3.10"
packages = ["aus_accounting_mcp"]
ignore_missing_imports = true
pretty = true
