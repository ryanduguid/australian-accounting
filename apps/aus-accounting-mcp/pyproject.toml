[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "aus-accounting-mcp"
version = "0.1.6"
description = "MCP facade for ATO benchmarks, Payday Super and limited Division 7A loan review. uvx from PyPI; not advice."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "model-context-protocol",
    "mcp-server",
    "australian-tax",
    "ato-benchmarks",
    "payday-super",
    "division-7a",
    "accounting-ai",
]
dependencies = [
    "mcp>=2.1.1,<3",
    # Exact pins, same intent as the commit pins these replace. PyPI rejects a
    # distribution whose metadata carries a direct URL reference, so a git pin
    # here makes the package unpublishable.
    "payday-super-checker==0.1.2",
    "ato-benchmark-compare==0.1.4",
    "div7a-loan-review==0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14",
    "build>=1.2",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "Pillow==12.3.0",
    "twine==7.0.0",
    'tomli>=2.0.1; python_version < "3.11"',
]

[project.scripts]
aus-accounting-mcp = "aus_accounting_mcp.cli:main"
aus-accounting-mcp-demo = "aus_accounting_mcp.demo:main"

[project.urls]
Homepage = "https://duguid.com.au/tools/australian-tax-ai-agents/"
Repository = "https://github.com/ryanduguid/australian-accounting.git"

[tool.hatch.build.targets.wheel]
packages = ["aus_accounting_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["aus_accounting_mcp", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["aus_accounting_mcp"]
ignore_missing_imports = true
pretty = true
