[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aus-accounting-mcp"
version = "0.7.1"
description = "Local accounting reviews, fourteen bounded tax and super worksheets and cited retrieval from your configured local Markdown folder. uvx from PyPI; not advice."
readme = "README.md"
requires-python = ">=3.14"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "model-context-protocol",
    "mcp-server",
    "australian-tax",
    "ato-benchmarks",
    "payday-super",
    "division-7a",
    "accounting-ai",
    "ato",
    "accounting",
    "tax",
]
# PyPI facets. No "License ::" classifier: the SPDX `license` field above is the
# PEP 639 replacement and the 2 together are rejected. No "Typing :: Typed"
# either, because this distribution ships no py.typed marker; it is a server to
# run, not a library to import against.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=2.3.0,<3",
    # Exact pins, same intent as the commit pins these replace. PyPI rejects a
    # distribution whose metadata carries a direct URL reference, so a git pin
    # here makes the package unpublishable.
    "payday-super-checker==0.2.3",
    "ato-benchmark-compare==0.2.2",
    "div7a-loan-review==0.3.2",
    "australian-tax-calculators==0.2.0",
    "gst-review==0.1.0",
    "lodgment-calendar==0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "pyright[nodejs]==1.1.414", "nodejs-wheel-binaries==24.19.0",
    "build>=1.6.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "Pillow==13.0.0",
    # release-python builds without isolation, so the backend comes from this
    # locked extra, pinned exactly as [build-system] requires.
    "setuptools==84.2.1",
]

[project.scripts]
aus-accounting-mcp = "aus_accounting_mcp.cli:main"
aus-accounting-mcp-demo = "aus_accounting_mcp.demo:main"

[project.urls]
Homepage = "https://duguid.com.au/tools/australian-tax-ai-agents/"
Repository = "https://github.com/ryanduguid/australian-accounting.git"
Documentation = "https://github.com/ryanduguid/australian-accounting/blob/main/apps/aus-accounting-mcp/docs/REFERENCE.md"
Changelog = "https://github.com/ryanduguid/australian-accounting/blob/main/apps/aus-accounting-mcp/RELEASE_NOTES.md"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[tool.setuptools]
packages = [
    "aus_accounting_mcp",
    "aus_accounting_mcp.adapters",
    "aus_accounting_mcp.fixtures",
]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["aus_accounting_mcp", "tests"]

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, and import sorting. Wider than the
# first-enablement E9/F82 set, and the same shape as the engines' own gates.
# Decimal("10.00") money literals stay: no rule here rewrites a literal.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# Keep an aliased engine import beside its siblings. Without this, sorting
# splits `__version__ as PAYDAY_VERSION` out into a second statement from the
# same module, which is more lines saying less.
combine-as-imports = true
# These are the first-party ones. `src` names source roots, and neither
# directory is the project root, so without this the local imports sort in
# among mcp, pydantic and pytest. `evaluation` is the harness the suite
# imports, and it is this repository's, not a dependency.
known-first-party = ["aus_accounting_mcp", "evaluation"]

[tool.pyright]
pythonVersion = "3.14"
include = ["aus_accounting_mcp"]
typeCheckingMode = "standard"
reportMissingImports = "none"
extraPaths = [
    "../../packages/ato-benchmark-compare",
    "../../packages/payday-super-checker",
    "../../packages/div7a-loan-review",
    "../../packages/australian-tax-calculators",
    "../../packages/lodgment-calendar",
]

[tool.coverage.report]
# CI fails the test job below complete line and branch coverage.
fail_under = 100
exclude_also = ['if __name__ == "__main__":']
