# cargo audit reads this file whenever it runs in this directory, as the
# dependency-audit job in .github/workflows/ci-rust.yml does. It applies to
# audits run from this directory and holds one dated exception. Unmaintained notices fail only the
# scheduled audit (Ryan, 18 November 2026), so that is the run it changes.
#
# RUSTSEC-2026-0543: chrono is unmaintained (informational; RustSec, 17 November
# 2026). This crate does not use chrono itself. chrono 0.4.45 reaches the lock file only
# through rmcp 3.10.0, which depends on chrono unconditionally, both directly and
# through schemars with its chrono04 feature; rmcp 3.11.0, its latest release on
# 20 November 2026, still does. Remove this exception when rmcp drops chrono.
[advisories]
ignore = ["RUSTSEC-2026-0543"]
