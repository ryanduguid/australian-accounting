[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lodgeit-calculator-adapter"
version = "0.1.0"
description = "Optional, explicitly enabled adapter for the LodgeiT Labs calculator constellation, with independent comparison trials. Never called by an offline engine."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australian-tax", "division-7a", "fbt", "depreciation", "interoperability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# No runtime dependency. The transport is urllib from the standard library, so
# nothing is added to the audit surface of a component whose whole job is to
# make a network call carefully.
dependencies = []

[project.optional-dependencies]
# The MCP surface is a separate switch from the adapter's network enablement.
mcp = ["mcp>=2.3.0,<3"]
# The comparison trials need the engines they compare against. Exact pins, the
# same shape apps/aus-accounting-mcp uses: a published distribution cannot
# depend on a path, and inside the workspace these resolve to the tree.
trials = [
    "div7a-loan-review==0.1.2",
    "australian-tax-calculators==0.1.3",
]
dev = [
    "ruff==0.17.0",
    "pyright[nodejs]==1.1.414", "nodejs-wheel-binaries==24.19.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
    "build>=1.6.1",
    "setuptools==84.2.1",
    "div7a-loan-review==0.1.2",
    "australian-tax-calculators==0.1.3",
]

[project.scripts]
lodgeit-adapter = "lodgeitadapter.cli:main"

[project.urls]
Homepage = "https://github.com/ryanduguid/australian-accounting/tree/main/apps/lodgeit-calculator-adapter"
Repository = "https://github.com/ryanduguid/australian-accounting.git"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[tool.setuptools]
packages = [
    "lodgeitadapter",
    "lodgeitadapter.trials",
    "lodgeitadapter.contracts",
    "lodgeitadapter.fixtures",
    "lodgeitadapter.docs",
]
include-package-data = false

[tool.setuptools.package-dir]
"lodgeitadapter.contracts" = "contracts"
"lodgeitadapter.fixtures" = "fixtures"
"lodgeitadapter.docs" = "docs"

[tool.setuptools.package-data]
"lodgeitadapter.contracts" = ["*.json","README.md"]
"lodgeitadapter.fixtures" = ["*.json"]
"lodgeitadapter.docs" = ["core-security.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["lodgeitadapter", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["lodgeitadapter"]

[tool.pyright]
pythonVersion = "3.14"
include = ["lodgeitadapter"]
typeCheckingMode = "standard"
reportMissingImports = "none"

[tool.coverage.run]
source = ["lodgeitadapter"]

[tool.coverage.report]
# CI fails the test job below complete line and branch coverage.
fail_under = 100
exclude_also = ['if __name__ == "__main__":']
