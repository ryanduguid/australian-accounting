# SonarQube Cloud automatic analysis settings.

# Test code is analysed with the test rules and kept out of the production
# measures. Sources and tests both start at the root; the same patterns move
# test files from one set to the other, so no file is in both.
sonar.sources=.
sonar.exclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts

# The analyser supports Python up to 3.14; this code targets Python 3.14 and later.
sonar.python.version=3.14

# The Rust engines are standalone by design (AGENTS.md: no shared runtime
# library; tests/test_rust_engine.py: no path dependencies), so each carries its
# own copy of the Python-compatibility modules (CPython's json, decimal, re,
# argparse, csv, http.client and text semantics, and the generated Unicode
# tables), its argparse-style command line, its WebAssembly wrapper, its example
# workbook builder and its fuzz target body. Division 7A's jsonkeys.rs copies
# the calculators' repeated-key scan; tests/test_shared_blocks.py pins it.
# The calculators' metadata.rs transcribes ATO and legislation rate and
# coefficient tables, and their texts.rs holds only the scope, source, warning
# and refusal-code text tables, one row shape per table, so both repeat by
# design too.
# Leave those deliberate copies and tables out of copy-paste detection so
# duplication measures the rest of each crate's code.
sonar.cpd.exclusions=**/py*.rs,**/unitables.rs,**/src/tables.rs,**/decimal.rs,**/sre.rs,**/argparse.rs,**/argtheme.rs,**/termsize.rs,**/textwrap.rs,**/csvread.rs,**/https.rs,**/raw.rs,**/unicode.rs,**/strptime.rs,**/strptime_table.rs,packages/*/src/cli.rs,packages/*/wasm/src/lib.rs,packages/*/src/fuzzing.rs,**/examples/build_workbook/**,packages/australian-tax-calculators/src/metadata.rs,packages/australian-tax-calculators/src/texts.rs,packages/div7a-loan-review/src/jsonkeys.rs
