# SonarQube Cloud automatic analysis settings.

# Test code is analysed with the test rules and kept out of the production
# measures. Sources and tests both start at the root; the same patterns move
# test files from one set to the other, so no file is in both.
sonar.sources=.
sonar.exclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts

# The analyser supports Python up to 3.14; this code targets Python 3.14 and later.
sonar.python.version=3.14

# Copy-paste detection skips 2 kinds of file that repeat across components on
# purpose. They stay in every other measure.
#
# Generated tables (unitables, pycase, pyunicode, tables, strptime_table): each
# standalone Rust component carries its own copy of the same generator output
# (headed "Generated by ... Do not edit"), and the strptime table repeats its
# regex fragments row by row. They are fixed by regenerating, not by editing.
#
# Ports of Python standard library and runtime behaviour (decimal through raw)
# and the workbook builders' OOXML model and Excel recalculation helpers:
# AGENTS.md forbids a shared runtime library and says engines never import one
# another, so every component that needs one keeps its own copy, and duplication
# across components is expected. This check would not catch drift between the
# copies either way.
sonar.cpd.exclusions=**/src/unitables.rs,**/src/pycase.rs,**/src/pyunicode.rs,**/src/tables.rs,**/src/strptime_table.rs,**/src/decimal.rs,**/src/sre.rs,**/src/py.rs,**/src/pyjson.rs,**/src/argparse.rs,**/src/csvread.rs,**/src/argtheme.rs,**/src/pytext.rs,**/src/pypath.rs,**/src/pyvalue.rs,**/src/termsize.rs,**/src/pyurl.rs,**/src/pyre.rs,**/src/https.rs,**/src/pydatetime.rs,**/src/textwrap.rs,**/src/pyos.rs,**/src/strptime.rs,**/src/unicode.rs,**/src/raw.rs,**/examples/build_workbook/model.rs,**/examples/build_workbook/excel.rs
