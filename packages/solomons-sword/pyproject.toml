[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solomons-sword"
version = "0.1.3"
description = "Trust distribution allocation, Section 100A / 99B risk evaluation, and Division 6 ITAA 1936 compliance for Australian trusts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "australian-tax",
    "trust-accounting",
    "section-100a",
    "section-99b",
    "division-6",
    "bamford",
    "itaa1936",
    "accounting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/solomons-sword"
Repository = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/solomons-sword"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11",
    "mypy>=1.14",
    "build>=1.2",
]

[project.scripts]
solomons-sword = "louisgoldberg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["louisgoldberg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=louisgoldberg --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["louisgoldberg", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["louisgoldberg"]
pretty = true
