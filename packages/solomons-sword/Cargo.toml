[package]
name = "solomons-sword"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Division 6 trust allocation, s 100A risk zoning and s 99B review aids"
license = "FSL-1.1-ALv2"
repository = "https://github.com/ryanduguid/australian-accounting"
homepage = "https://duguid.com.au/tools/trust-distributions/"
publish = false

[dependencies]
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1

# Asset names the release workflow will publish once release-policy has a Rust
# binary family; see the root README.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
