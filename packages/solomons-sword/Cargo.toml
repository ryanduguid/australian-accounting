[package]
name = "solomons-sword"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Division 6 trust allocation, s 100A risk zoning and s 99B review aids"
license = "Apache-2.0"
publish = false

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
