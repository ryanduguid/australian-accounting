[package]
name = "australian-tax-calculators"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
description = "Bounded Australian tax calculation worksheets with explicit scope and sources"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ryanduguid/australian-accounting"
homepage = "https://duguid.com.au/tools/australian-tax-ai-agents/"
publish = false

[dependencies]
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

[profile.release]
lto = true
codegen-units = 1

# The assets release-australian-tax-calculators.yml publishes through
# release-policy's release-binary.yml: the executable sits at each archive's top
# level, for x86_64 Linux (musl) and Windows only.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# The extract parser's own tests run with the crate's.
[[example]]
name = "dgr_register"
test = true
