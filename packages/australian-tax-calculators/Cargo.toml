[package]
name = "australian-tax-calculators"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Bounded Australian tax calculation worksheets with explicit scope and sources"
license = "Apache-2.0"
publish = false

[dependencies]
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

[profile.release]
lto = true
codegen-units = 1
