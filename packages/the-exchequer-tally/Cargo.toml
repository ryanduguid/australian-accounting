[package]
name = "the-exchequer-tally"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Corporate tax, franking ledger and Division 203 benchmark review aids"
license = "Apache-2.0"
publish = false

[dependencies]
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
