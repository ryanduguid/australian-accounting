[package]
name = "the-exchequer-tally"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Corporate tax, franking ledger and Division 203 benchmark review aids"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ryanduguid/australian-accounting"
homepage = "https://duguid.com.au/tools/company-tax-franking/"
publish = false

[dependencies]
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1

# The assets release-the-exchequer-tally.yml publishes through release-policy's
# release-binary.yml: the executable sits at each archive's top level, for
# x86_64 Linux (musl) and Windows only.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
