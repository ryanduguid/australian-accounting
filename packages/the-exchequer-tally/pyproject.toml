[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-exchequer-tally"
version = "0.1.5"
description = "Corporate tax rate verification, franking account ledger tracking, and Division 203 benchmark rule compliance for Australian companies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/the-exchequer-tally"
Repository = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/the-exchequer-tally"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[project.optional-dependencies]
# Shared toolchain, pinned to the same versions in every component so a gate
# behaves the same wherever it runs.
dev = [
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "coverage==7.16.0",
    "pytest-cov==7.1.0",
    "build==1.6.0",
]

[project.scripts]
the-exchequer-tally = "edwinnixon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["edwinnixon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Coverage is switched on by the pytest-cov flags CI passes, the same way in every
# component, so a plain pytest run stays uninstrumented. See CONTRIBUTING.md.
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["edwinnixon", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["edwinnixon"]
pretty = true

[tool.coverage.run]
# The source pytest --cov measures; CI adds --cov-branch and the reports.
source = ["edwinnixon"]
