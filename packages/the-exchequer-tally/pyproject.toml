[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-exchequer-tally"
version = "0.1.8"
description = "Corporate tax rate verification, franking account ledger tracking, and Division 203 benchmark rule compliance for Australian companies."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/the-exchequer-tally"
Repository = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/the-exchequer-tally"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[project.optional-dependencies]
# Shared toolchain, pinned to the same versions in every component so a gate
# behaves the same wherever it runs.
dev = [
    "ruff==0.17.0",
    "pyright[nodejs]==1.1.414", "nodejs-wheel-binaries==24.19.0",
    "pytest==9.1.1",
    "coverage==7.16.2",
    "pytest-cov==7.1.0",
    "build==1.6.1",
    # release-python builds without isolation, so the backend comes from this
    # locked extra, pinned exactly as [build-system] requires.
    "setuptools==84.0.0",
]

[project.scripts]
the-exchequer-tally = "edwinnixon.cli:main"

[tool.setuptools]
packages = ["edwinnixon"]
include-package-data = false

[tool.setuptools.package-data]
"edwinnixon" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Coverage is switched on by the pytest-cov flags CI passes, the same way in every
# component, so a plain pytest run stays uninstrumented. See CONTRIBUTING.md.
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["edwinnixon", "tests"]

[tool.ruff.lint]
# The shared workspace baseline: ruff's default correctness set plus import
# sorting. Money literals stay exactly as written: no rule here rewrites one.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
pythonVersion = "3.14"
include = ["edwinnixon"]
typeCheckingMode = "standard"

[tool.coverage.run]
# The source pytest --cov measures; CI adds --cov-branch and the reports.
source = ["edwinnixon"]

[tool.coverage.report]
# CI fails the test job below complete line and branch coverage.
fail_under = 100
exclude_also = ['if __name__ == "__main__":']
