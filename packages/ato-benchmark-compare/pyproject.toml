[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ato-benchmark-compare"
dynamic = ["version"]
description = "Compare profit and loss figures against the ATO small business benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["ato", "australia", "accounting", "benchmarks", "tax", "small business"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/ato-benchmark-compare"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[project.scripts]
ato-benchmark-compare = "atobenchmark.cli:main"

[project.optional-dependencies]
# Shared toolchain first, pinned to the same versions in every component so a
# gate behaves the same wherever it runs. Package-specific test libraries follow.
dev = [
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "coverage==7.16.0",
    "pytest-cov==7.1.0",
    "build==1.6.0",
    "diff-cover==10.5.1",
    "hypothesis==6.165.10",
    "openpyxl==3.1.5",
]

[tool.hatch.version]
# One version string for the project, read from the module the runtime and the
# release gate both import. A duplicate in this file drifted from the module
# once already and shipped 0.1.3 announcing itself as 0.1.2.
path = "atobenchmark/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["atobenchmark"]

[tool.hatch.build.targets.sdist]
include = [
  "/atobenchmark",
  "/tests",
  "/tools",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["atobenchmark", "tests"]

[tool.ruff.lint]
# The shared workspace baseline: ruff's default correctness set plus import
# sorting. Money literals stay exactly as written: no rule here rewrites one.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["atobenchmark"]
ignore_missing_imports = true
pretty = true


[tool.coverage.run]
# The source pytest --cov measures; CI adds --cov-branch and the reports.
source = ["atobenchmark"]
