[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ato-benchmark-compare"
version = "0.2.0"
description = "Compare profit and loss figures against the ATO small business benchmarks"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["ato", "australia", "accounting", "benchmarks", "tax", "small business"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/ato-benchmark-compare"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[project.scripts]
ato-benchmark-compare = "atobenchmark.cli:main"

[project.optional-dependencies]
# Shared toolchain first, pinned to the same versions in every component so a
# gate behaves the same wherever it runs. Package-specific test libraries follow.
dev = [
    "ruff==0.17.0",
    "pyright[nodejs]==1.1.414", "nodejs-wheel-binaries==24.19.0",
    "pytest==9.1.1",
    "coverage==7.16.2",
    "pytest-cov==7.1.0",
    "build==1.6.1",
    "diff-cover==10.6.0",
    "openpyxl==3.1.5",
    # release-python builds without isolation, so the backend comes from this
    # locked extra, pinned exactly as [build-system] requires.
    "setuptools==84.0.0",
]

[tool.setuptools]
packages = ["atobenchmark"]
include-package-data = false

[tool.setuptools.package-data]
"atobenchmark" = ["data/*.json","py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["atobenchmark", "tests"]

[tool.ruff.lint]
# The shared workspace baseline: ruff's default correctness set plus import
# sorting. Money literals stay exactly as written: no rule here rewrites one.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
pythonVersion = "3.14"
include = ["atobenchmark"]
typeCheckingMode = "standard"
reportMissingImports = "none"

[tool.coverage.run]
# The source pytest --cov measures; CI adds --cov-branch and the reports.
source = ["atobenchmark"]

[tool.coverage.report]
# CI fails the test job below complete line and branch coverage.
fail_under = 100
exclude_also = ['if __name__ == "__main__":']
