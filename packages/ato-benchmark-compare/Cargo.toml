[package]
name = "ato-benchmark-compare"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Compare profit and loss figures against the ATO small business benchmarks"
license = "Apache-2.0"
publish = false

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1

[[example]]
name = "benchmark_history"
test = true
