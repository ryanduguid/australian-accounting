[package]
name = "div7a-loan-review"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Experimental review aid for ITAA 1936 Division 7A complying loan terms and minimum yearly repayments"
license = "Apache-2.0"
publish = false

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
