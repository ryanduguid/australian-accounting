name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint
        run: python -m ruff check div7aloan tests

      - name: Types
        run: python -m mypy

      - name: Tests
        run: python -m pytest -q

      - name: Sample registers behave as documented
        run: |
          div7a-loan-review review --input examples/sample_loans_myr_met.csv --year 2026-27
          div7a-loan-review review --input examples/sample_loans_mixed.csv --year 2026-27 || [ $? -eq 2 ]

      - name: No network access in the rate table
        run: |
          ! grep -rniE 'requests\.|urllib|http://|urlopen|socket\.' div7aloan/*.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel and run the CLI from it
        run: |
          python -m pip install dist/*.whl
          div7a-loan-review rate --year 2026-27 --format json
