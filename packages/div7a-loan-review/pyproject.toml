[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "div7a-loan-review"
version = "0.1.2"
description = "Experimental review aid for ITAA 1936 Division 7A complying loan terms and minimum yearly repayments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "division-7a", "itaa-1936", "accounting", "ato", "tax"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://duguid.com.au/rates/div7a-benchmark-rate/"
Repository = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/div7a-loan-review"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[project.optional-dependencies]
# Shared toolchain first, pinned to the same versions in every component so a
# gate behaves the same wherever it runs. Package-specific test libraries follow.
dev = [
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "coverage==7.16.0",
    "pytest-cov==7.1.0",
    "build==1.6.0",
    "openpyxl==3.1.5",
]

[project.scripts]
div7a-loan-review = "div7aloan.cli:main"

[tool.setuptools]
packages = ["div7aloan"]
include-package-data = false

[tool.setuptools.package-data]
div7aloan = ["data/*.csv", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["div7aloan", "tests"]

[tool.ruff.lint]
# The shared workspace baseline: ruff's default correctness set plus import
# sorting. Money literals stay exactly as written: no rule here rewrites one.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["div7aloan"]
ignore_missing_imports = true
pretty = true

[tool.coverage.run]
# The source pytest --cov measures; CI adds --cov-branch and the reports.
source = ["div7aloan"]
