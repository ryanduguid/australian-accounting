[package]
name = "payday-super-checker"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Experimental review aid for Australian payday-super deadlines and SG charge estimates"
license = "Apache-2.0"
repository = "https://github.com/ryanduguid/australian-accounting"
publish = false

[[bin]]
name = "payday-super-check"
path = "src/main.rs"

# Rust port of tools/build_workbook.py, in progress; dev-dependencies only, so
# the release binary links none of it. `test = true` runs its unit tests under
# `cargo test`.
[[example]]
name = "build_workbook"
path = "examples/build_workbook/main.rs"
test = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
roxmltree = "=0.21.1"
rust_xlsxwriter = "=0.101.0"
zip = { version = "=9.1.0", default-features = false, features = ["deflate"] }

# Asset names the release workflow will publish once release-policy has a Rust
# binary family; see the root README.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
