[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payday-super-checker"
version = "0.1.3"
description = "Experimental review aid for Australian payday-super deadlines and SG charge estimates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "superannuation", "payday-super", "accounting", "ato"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
[project.urls]
Homepage = "https://duguid.com.au/tools/payday-super/"
Repository = "https://github.com/ryanduguid/australian-accounting/tree/main/packages/payday-super-checker"
Issues = "https://github.com/ryanduguid/australian-accounting/issues"

[project.optional-dependencies]
# Shared toolchain first, pinned to the same versions in every component so a
# gate behaves the same wherever it runs. Package-specific test libraries follow.
dev = [
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "coverage==7.16.0",
    "pytest-cov==7.1.0",
    "build==1.6.0",
    "diff-cover==10.5.1",
    "hypothesis==6.165.10",
    "holidays==0.103",
    "openpyxl==3.1.5",
    "setuptools==84.0.0",
]

[project.scripts]
payday-super-check = "paydaysuper.cli:main"

[tool.setuptools]
packages = ["paydaysuper"]
include-package-data = false

[tool.setuptools.package-data]
paydaysuper = ["data/*.json", "data/profiles/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["paydaysuper", "tests"]

[tool.ruff.lint]
# The shared workspace baseline: ruff's default correctness set plus import
# sorting. Money literals stay exactly as written: no rule here rewrites one.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["paydaysuper"]
ignore_missing_imports = true
pretty = true

[tool.coverage.run]
# The source pytest --cov measures; CI adds --cov-branch and the reports.
source = ["paydaysuper"]
