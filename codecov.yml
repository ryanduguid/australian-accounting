# Post statuses once both Python reports, which every run uploads, have arrived.
codecov:
  notify:
    after_n_builds: 2
# cargo llvm-cov writes absolute runner paths into each crate's lcov report.
fixes:
  - "/home/runner/work/australian-accounting/australian-accounting/::"
# A crate uploads only when a pull request runs it; other commits carry its last report forward.
flag_management:
  default_rules:
    carryforward: true
coverage:
  round: down
  status:
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude
    project:
      # The whole repository, every crate and Python flag together: what main
      # measures, rounded down. Raise it with the tests, never lower it to pass.
      default:
        target: 93%
        threshold: 0%
        if_not_found: failure
      aus-accounting-mcp:
        target: 100%
        threshold: 0%
        if_not_found: failure
        flags:
          - aus-accounting-mcp
      lodgment-calendar:
        target: 100%
        threshold: 0%
        if_not_found: failure
        flags:
          - lodgment-calendar
      # The crate's enforced line floor in .github/ci/rust_coverage_floors.json.
      australian-tax-calculators:
        target: 98%
        threshold: 0%
        # The base report lacks this flag until main's first crate upload.
        if_not_found: success
        flags:
          - australian-tax-calculators
    patch:
      default:
        informational: true
comment: false
