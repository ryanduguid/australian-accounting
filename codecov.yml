# Require exact project coverage across both fresh Python reports.
codecov:
  notify:
    after_n_builds: 2
coverage:
  round: down
  status:
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude
    project:
      default:
        target: 100%
        threshold: 0%
        if_not_found: failure
      aus-accounting-mcp:
        target: 100%
        threshold: 0%
        if_not_found: failure
        flags:
          - aus-accounting-mcp
      lodgment-calendar:
        target: 100%
        threshold: 0%
        if_not_found: failure
        flags:
          - lodgment-calendar
    patch:
      default:
        informational: true
comment: false
