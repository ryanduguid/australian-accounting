name: readme-quick-start

# Follows README.md's "Try one contribution" as a reader would: download the
# linked synthetic CSV, then run the README's uvx command in an empty directory
# outside the checkout. The weekly run catches a moved CSV or a pinned release
# that no longer behaves as the README says, which no README change would show.
# Every pull request runs the workflow so readme-quick-start-gates always
# reports; the changes job skips trial when none of its paths changed.

on:
  workflow_dispatch:
  schedule:
    # Mondays 08:30 AEST.
    - cron: "30 22 * * 0"
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/readme-quick-start.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces that pull request's older run.
  # Every other run is keyed on its commit, so a later merge cannot cancel
  # an earlier commit's run on main.
  group: readme-quick-start-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        env:
          # The former pull_request trigger paths.
          CI_PATHS: |
            README.md
            .github/workflows/readme-quick-start.yml
        run: python3 .github/ci/app_ci.py select readme-quick-start >> "$GITHUB_OUTPUT"

  trial:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Follow the README in an empty directory
        run: |
          set -euo pipefail
          readme="$PWD/README.md"
          work="$(mktemp -d)"
          cd "$work"
          url="$(grep -o '\[download the synthetic CSV\]([^)]*)' "$readme" | sed 's/.*(//; s/)$//')"
          test -n "$url"
          curl -fsSL --retry 3 "$url" -o timely_remittance_no_receipt.csv
          trial="$(grep '^uvx --from payday-super-checker' "$readme")"
          case "$trial" in *" --confirm-remittance-only "* | *" --confirm-remittance-only") ;; *) exit 1 ;; esac
          # The README's **Output:** line names the verdict and the due date.
          output="$(grep '^\*\*Output:\*\*' "$readme")"
          # shellcheck disable=SC2016 # the backticks are literal Markdown
          verdict="$(printf '%s' "$output" | grep -o '`[A-Z_]*`' | head -n 1 | tr -d '`')"
          due_text="$(printf '%s' "$output" | grep -oE 'due [0-9]{1,2} [A-Z][a-z]+ [0-9]{4}' | sed 's/^due //')"
          test -n "$verdict" && test -n "$due_text"
          due="$(date -d "$due_text" +%F)"
          bash -c "$trial" > trial.out
          python3 - "$verdict" "$due" <<'PY'
          import csv
          import sys

          verdict, due = sys.argv[1:]
          with open("payday-report.csv", encoding="utf-8-sig", newline="") as report:
              rows = [row for row in csv.DictReader(report) if row["employee_id"] != "NOTE"]
          assert [(r["verdict"], r["due_date"]) for r in rows] == [(verdict, due)], rows
          PY
          # Without the confirmation the README promises the same verdict and exit 2.
          set +e
          bash -c "${trial/ --confirm-remittance-only/}" > unconfirmed.out
          status=$?
          set -e
          test "$status" -eq 2
          grep -Eq "(^|[[:space:]])${verdict}: 1([[:space:]]|$)" unconfirmed.out

  readme-quick-start-gates:
    needs: [changes, trial]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate readme-quick-start
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/readme-quick-start.yml readme-quick-start-gates --no-results
