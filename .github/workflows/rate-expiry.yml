name: rate expiry

# A warning, not a gate: no branch protection requires it. It fails 28 days
# before payday-super-checker's GIC table or lodgment-calendar's holiday table
# ends, so a weekly run gives at least 21 days to extend the table and release
# before estimates are withheld or due dates turn UNKNOWN. The failed run is the
# signal; the portfolio audit reporting it is intended.

on:
  schedule:
    # Mondays 08:00 AEST.
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dated-tables:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: python .github/ci/check_rate_expiry.py
