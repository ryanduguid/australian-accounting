name: rate expiry

# A warning, not a gate: no branch protection requires it. It fails 28 days
# before payday-super-checker's GIC table ends, so a weekly run gives at least 21
# days to add the next quarter and release before estimates are withheld. The
# failed run is the signal; the portfolio audit reporting it is intended.

on:
  schedule:
    # Mondays 08:00 AEST.
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gic-table:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python .github/ci/check_rate_expiry.py
