name: Rust engine checks

on:
  workflow_call:
    inputs:
      package:
        description: Crate directory, named as the crate, under the root directory.
        type: string
        required: true
      root:
        description: The directory holding the crate, packages for an engine or apps for an application.
        type: string
        default: packages
      binary:
        description: The command the engine builds, when it differs from the directory name.
        type: string
        default: ""
      smoke:
        description: Arguments that must exit 0 from the built command.
        type: string
        default: --api-help

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.root }}/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run the tests
        if: runner.os != 'Linux'
        run: cargo test --locked
      # strace lets tests/no_network.rs watch a real calculation. Coverage needs
      # llvm-tools and a prebuilt cargo-llvm-cov, with no fallback to compiling it.
      - name: Install strace and llvm-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
          rustup component add llvm-tools
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      # Each floor is the crate's measured line coverage, rounded down (31 October
      # 2026). Raise it with the tests, never lower it to pass.
      - name: Run the tests with a line coverage floor
        if: runner.os == 'Linux'
        env:
          CRATE: ${{ inputs.package }}
        run: |
          floor="$(jq --exit-status --arg crate "$CRATE" '.[$crate]' "$GITHUB_WORKSPACE/.github/ci/rust_coverage_floors.json")"
          cargo llvm-cov --locked --fail-under-lines "$floor"
      - run: cargo build --locked --release
      - name: Smoke the native command
        env:
          BINARY: ${{ inputs.binary || inputs.package }}
          SMOKE: ${{ inputs.smoke }}
        run: ./target/release/$BINARY $SMOKE
      # The archive layout the cargo-binstall metadata in Cargo.toml names. CI
      # keeps it as a short-lived artefact only; nothing here publishes it.
      - name: Package the native command
        id: archive
        env:
          BINARY: ${{ inputs.binary || inputs.package }}
          CRATE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          base="$CRATE-$version-$target"
          mkdir -p "dist/$base"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/release/$BINARY.exe" "dist/$base/"
            (cd dist && 7z a -tzip "$base.zip" "$base" >/dev/null)
            archive="$base.zip"
          else
            cp "target/release/$BINARY" "dist/$base/"
            tar -C dist -czf "dist/$base.tgz" "$base"
            archive="$base.tgz"
          fi
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Check the browser engine against the native command
        if: runner.os == 'Linux' && (inputs.package == 'div7a-loan-review' || inputs.package == 'payday-super-checker')
        env:
          ENGINE: ${{ inputs.package }}
          BINARY: ${{ inputs.binary || inputs.package }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --manifest-path wasm/Cargo.toml --check
          cargo clippy --manifest-path wasm/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path wasm/Cargo.toml --locked
          cargo clippy --manifest-path wasm/Cargo.toml --locked --target wasm32-unknown-unknown --lib -- -D warnings
          cargo build --manifest-path wasm/Cargo.toml --locked --release --target wasm32-unknown-unknown
          node ../../.github/ci/check_engine_wasm.mjs "$ENGINE" "target/release/$BINARY"
      - name: Keep native candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package }}-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ inputs.root }}/${{ inputs.package }}/dist/${{ steps.archive.outputs.path }}
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Cargo lock
        working-directory: ${{ inputs.root }}/${{ inputs.package }}
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
