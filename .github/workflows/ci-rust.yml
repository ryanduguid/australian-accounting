name: Rust engine checks

on:
  workflow_call:
    inputs:
      package:
        description: Engine directory under packages/; also its binary name.
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Smoke the native command
        run: ./target/release/${{ inputs.package }} --api-help
      - name: Keep native candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package }}-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/${{ inputs.package }}/target/release/${{ inputs.package }}
            packages/${{ inputs.package }}/target/release/${{ inputs.package }}.exe
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Cargo lock
        working-directory: packages/${{ inputs.package }}
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
