name: Rust engine checks

on:
  workflow_call:
    inputs:
      package:
        description: Crate directory, named as the crate, under the root directory.
        type: string
        required: true
      root:
        description: The directory holding the crate, packages for an engine or apps for an application.
        type: string
        default: packages
      binary:
        description: The command the engine builds, when it differs from the directory name.
        type: string
        default: ""
      extra-binaries:
        description: Optional space-separated commands to include in the candidate archive.
        type: string
        default: ""
      extra-examples:
        description: Optional space-separated Cargo examples to build and archive under examples/.
        type: string
        default: ""
      candidate-files:
        description: Optional whitespace-separated repository files to include with a content/build record.
        type: string
        default: ""
      candidate-test:
        description: Optional ignored Rust integration test to run against the extracted archive.
        type: string
        default: ""
      smoke:
        description: Arguments that must exit 0 from the built command.
        type: string
        default: --api-help

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.root }}/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy
      # Only the Windows legs, the slowest, restore a dependency cache, which
      # keeps 11 crates' entries within the repository's cache budget. Only main
      # saves, so pull requests cannot replace the shared entries. shortcut: the
      # key hashes the runner image's toolchains, so an image Rust update misses
      # until the next main push saves.
      - name: Restore the dependency build cache
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.root }}/${{ inputs.package }}
          key: ${{ inputs.package }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Code behind a feature, such as the adapter's differential harness, is
      # linted only with it, and code behind cfg(not(feature)) only without it.
      # The tests keep the default features, the shipped build: the differential
      # feature fixes the clock and reads harness variables, and the harness that
      # compares against Python is kept outside the repository.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run the tests
        if: runner.os != 'Linux'
        run: cargo test --locked
      # strace lets tests/no_network.rs watch a real calculation. Coverage needs
      # llvm-tools and a prebuilt cargo-llvm-cov, with no fallback to compiling it.
      - name: Install strace and llvm-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
          rustup component add llvm-tools
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      # Each floor is the crate's measured line coverage, rounded down (31 October
      # 2026). Raise it with the tests, never lower it to pass.
      - name: Run the tests with a line coverage floor
        if: runner.os == 'Linux'
        env:
          CRATE: ${{ inputs.package }}
        run: |
          floor="$(jq --exit-status --arg crate "$CRATE" '.[$crate]' "$GITHUB_WORKSPACE/.github/ci/rust_coverage_floors.json")"
          cargo llvm-cov --locked --fail-under-lines "$floor"
      - run: cargo build --locked --release
      - name: Build portable examples
        if: inputs.extra-examples != ''
        env:
          EXTRA_EXAMPLES: ${{ inputs.extra-examples }}
        run: |
          set -euo pipefail
          read -r -a examples <<< "$EXTRA_EXAMPLES"
          for example in "${examples[@]:-}"; do
            [[ -n "$example" ]] || continue
            cargo build --locked --release --example "$example"
          done
      - name: Smoke the native command
        env:
          BINARY: ${{ inputs.binary || inputs.package }}
          SMOKE: ${{ inputs.smoke }}
        run: |
          # SMOKE holds the arguments, so it is split on purpose.
          # shellcheck disable=SC2086
          ./target/release/"$BINARY" $SMOKE
      # The archive layout the cargo-binstall metadata in Cargo.toml names. CI
      # keeps it as a short-lived artefact only; nothing here publishes it.
      - name: Package the native command
        id: archive
        env:
          BINARY: ${{ inputs.binary || inputs.package }}
          CRATE: ${{ inputs.package }}
          EXTRA_BINARIES: ${{ inputs.extra-binaries }}
          EXTRA_EXAMPLES: ${{ inputs.extra-examples }}
          CANDIDATE_FILES: ${{ inputs.candidate-files }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          base="$CRATE-$version-$target"
          mkdir -p "dist/$base"
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          read -r -a extra_bins <<< "$EXTRA_BINARIES"
          for extra in "${extra_bins[@]:-}"; do
            [[ -n "$extra" ]] || continue
            cp "target/release/$extra$suffix" "dist/$base/"
          done
          read -r -a examples <<< "$EXTRA_EXAMPLES"
          for example in "${examples[@]:-}"; do
            [[ -n "$example" ]] || continue
            mkdir -p "dist/$base/examples"
            cp "target/release/examples/$example$suffix" "dist/$base/examples/"
          done
          cp "target/release/$BINARY$suffix" "dist/$base/"
          if [[ -n "$CANDIDATE_FILES" ]]; then
            # Paths are repository-relative and retain their layout in the bundle.
            while IFS= read -r file; do
              case "$file" in
                ''|/*|*\\*|*:*) echo "Invalid candidate file: $file" >&2; exit 1 ;;
              esac
              case "/$file/" in
                */../*|*/./*) echo "Invalid candidate file: $file" >&2; exit 1 ;;
              esac
              test -f "$GITHUB_WORKSPACE/$file"
              test ! -L "$GITHUB_WORKSPACE/$file"
              mkdir -p "dist/$base/$(dirname "$file")"
              cp "$GITHUB_WORKSPACE/$file" "dist/$base/$file"
            done < <(printf '%s\n' "$CANDIDATE_FILES" | tr '[:space:]' '\n' | sed '/^$/d')
            records="$(mktemp)"
            while IFS= read -r file; do
              if command -v sha256sum >/dev/null; then
                digest="$(sha256sum "dist/$base/$file" | cut -d ' ' -f 1)"
              else
                digest="$(shasum -a 256 "dist/$base/$file" | cut -d ' ' -f 1)"
              fi
              jq -cn --arg path "$file" --arg sha256 "$digest" '{path:$path,sha256:$sha256}' >> "$records"
            done < <(cd "dist/$base" && find . -type f | sed 's|^./||' | LC_ALL=C sort)
            jq -s --arg component "$CRATE" --arg version "$version" --arg target "$target" \
              --arg repository "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
              --arg rustc "$(rustc --version)" \
              '{schema:"native-ci-candidate.v1",component:$component,version:$version,target:$target,
                source:{repository:$repository,commit:$commit},rustc:$rustc,files:.}' \
              "$records" > "dist/$base/BUILD-INFO.json"
            rm "$records"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd dist && 7z a -tzip "$base.zip" "$base" >/dev/null)
            archive="$base.zip"
          else
            tar -C dist -czf "dist/$base.tgz" "$base"
            archive="$base.tgz"
          fi
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Check the browser engine against the native command
        if: runner.os == 'Linux' && (inputs.package == 'div7a-loan-review' || inputs.package == 'payday-super-checker')
        env:
          ENGINE: ${{ inputs.package }}
          BINARY: ${{ inputs.binary || inputs.package }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --manifest-path wasm/Cargo.toml --check
          cargo clippy --manifest-path wasm/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path wasm/Cargo.toml --locked
          cargo clippy --manifest-path wasm/Cargo.toml --locked --target wasm32-unknown-unknown --lib -- -D warnings
          cargo build --manifest-path wasm/Cargo.toml --locked --release --target wasm32-unknown-unknown
          node ../../.github/ci/check_engine_wasm.mjs "$ENGINE" "target/release/$BINARY"
      - name: Verify the extracted native candidate
        if: inputs.candidate-test != ''
        env:
          CANDIDATE_TEST: ${{ inputs.candidate-test }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
          BASE: ${{ steps.archive.outputs.base }}
        run: |
          set -euo pipefail
          unpacked="$(mktemp -d "$RUNNER_TEMP/native-candidate.XXXXXX")"
          [[ "$unpacked" == "$RUNNER_TEMP"/native-candidate.* && -d "$unpacked" && ! -L "$unpacked" ]]
          trap 'rm -rf "$unpacked"' EXIT
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z x -y "-o$unpacked" "dist/$ARCHIVE" >/dev/null
            NATIVE_CANDIDATE_ROOT="$(cygpath -w "$unpacked/$BASE")"
          else
            tar -xzf "dist/$ARCHIVE" -C "$unpacked"
            NATIVE_CANDIDATE_ROOT="$unpacked/$BASE"
          fi
          export NATIVE_CANDIDATE_ROOT
          export NATIVE_CANDIDATE_COMMIT="$GITHUB_SHA"
          cargo test --locked --release --test "$CANDIDATE_TEST" -- --ignored
      - name: Keep native candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package }}-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ inputs.root }}/${{ inputs.package }}/dist/${{ steps.archive.outputs.path }}
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit Cargo lock
        working-directory: ${{ inputs.root }}/${{ inputs.package }}
        run: cargo audit --deny warnings
