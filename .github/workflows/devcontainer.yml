name: devcontainer

# Builds the devcontainer with the Dev Containers CLI, which runs its lifecycle
# commands with the same semantics as Codespaces, then runs the fabricated MCP
# demonstration inside it. A broken Codespaces setup fails here instead of for
# a visitor. The push run on main also catches drift in the image tag. Every
# pull request runs the workflow so devcontainer-gates always reports; the
# changes job skips setup when none of its paths changed.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces that pull request's older run.
  # Every other run is keyed on its commit, so a later merge cannot cancel
  # an earlier commit's run on main.
  group: devcontainer-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.14"
  DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        env:
          # The former pull_request trigger paths.
          CI_PATHS: |
            .devcontainer/**
            .github/workflows/devcontainer.yml
            uv.lock
        run: python3 .github/ci/app_ci.py select devcontainer >> "$GITHUB_OUTPUT"

  setup:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the devcontainer and run its setup
        run: npx --yes --ignore-scripts "$DEVCONTAINER_CLI" up --workspace-folder .
      - name: Run the fabricated demonstration inside it
        run: npx --yes --ignore-scripts "$DEVCONTAINER_CLI" exec --workspace-folder . sh -c 'cd apps/aus-accounting-mcp && uv run --locked aus-accounting-mcp-demo > /dev/null'

  devcontainer-gates:
    needs: [changes, setup]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate devcontainer
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/devcontainer.yml devcontainer-gates --no-results
