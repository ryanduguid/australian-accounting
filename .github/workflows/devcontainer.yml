name: devcontainer

# Starts the image named in .devcontainer/devcontainer.json, runs its setup
# command, then the fabricated MCP demonstration, so a broken Codespaces setup
# fails here instead of for a visitor. The push run on main also catches drift
# in the image tag.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
      setup: ${{ steps.read.outputs.setup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .devcontainer
      - id: read
        name: Read the image and setup command
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          config = json.load(open(".devcontainer/devcontainer.json"))
          print(f"image={config['image']}")
          print(f"setup={config['postCreateCommand']}")
          PY

  setup:
    needs: config
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ needs.config.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the devcontainer setup command
        env:
          SETUP: ${{ needs.config.outputs.setup }}
        run: sh -c "$SETUP"
      - name: Run the fabricated demonstration
        working-directory: apps/aus-accounting-mcp
        run: uv run --locked aus-accounting-mcp-demo > /dev/null
