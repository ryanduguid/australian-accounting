name: devcontainer

# Starts the image named in .devcontainer/devcontainer.json, runs its setup
# command, then the fabricated MCP demonstration, so a broken Codespaces setup
# fails here instead of for a visitor. The push run on main also catches drift
# in the image tag.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
      setup: ${{ steps.read.outputs.setup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .devcontainer
      - id: read
        name: Read the image and setup command
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import shlex
          config = json.load(open(".devcontainer/devcontainer.json"))
          def shell(command):
              # A string runs through a shell; an array runs as argv, so quote it.
              return command if isinstance(command, str) else shlex.join(command)
          command = config["postCreateCommand"]
          if isinstance(command, dict):
              # An object's commands run in parallel; fail if any one fails.
              starts = "".join(f'( {shell(part)} ) & pids="$pids $!"; ' for part in command.values())
              setup = (f'pids=""; {starts}status=0; '
                       'for pid in $pids; do wait "$pid" || status=1; done; exit "$status"')
          else:
              setup = shell(command)
          print(f"image={config['image']}")
          # JSON keeps a multi-line command on one output line.
          print(f"setup={json.dumps(setup)}")
          PY

  setup:
    needs: config
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ needs.config.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the devcontainer setup command
        env:
          SETUP: ${{ fromJSON(needs.config.outputs.setup) }}
        run: sh -c "$SETUP"
      - name: Run the fabricated demonstration
        working-directory: apps/aus-accounting-mcp
        run: uv run --locked aus-accounting-mcp-demo > /dev/null
