name: Glama badge adapter

# Every pull request runs the workflow so glama-badges-gates always reports;
# the changes job skips the other jobs when none of its paths changed.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - tools/glama-badge-server/**
      - tools/glama-badge-worker/**
      - .github/workflows/glama-badges.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        env:
          # The former pull_request trigger paths.
          CI_PATHS: |
            tools/glama-badge-server/**
            tools/glama-badge-worker/**
            .github/workflows/glama-badges.yml
        run: python3 .github/ci/app_ci.py select glama-badges >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: tools/glama-badge-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99 fmt --check
      - run: cargo +1.99 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.99 test --locked
      - run: cargo +1.99 build --locked --release

  dependency-audit:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        tool: [glama-badge-server, glama-badge-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit Cargo lock
        working-directory: tools/${{ matrix.tool }}
        run: cargo audit --deny warnings

  worker:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: tools/glama-badge-worker
    env:
      WRANGLER_SEND_METRICS: 'false'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +1.99 fmt --check
      - run: cargo +1.99 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.99 clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings
      - run: cargo +1.99 test --locked
      - run: cargo +1.99 install worker-build --version 0.8.7 --locked
      - run: npm ci --ignore-scripts
      - run: worker-build --release
      - run: npm test
      - run: npm run dry-run
      - run: cargo +1.99 clippy --locked --all-targets --features synthetic-trial -- -D warnings
      - run: cargo +1.99 clippy --locked --target wasm32-unknown-unknown --lib --features synthetic-trial -- -D warnings
      - run: cargo +1.99 test --locked --features synthetic-trial
      - run: worker-build --release --out-dir build-synthetic -- --features synthetic-trial
      - run: npm run test:synthetic
      - run: npm run dry-run:synthetic

  glama-badges-gates:
    needs: [changes, check, dependency-audit, worker]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate glama-badges
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/glama-badges.yml glama-badges-gates --no-results
