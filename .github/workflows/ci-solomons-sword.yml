name: solomons-sword

# Component CI for packages/solomons-sword. The job, commands and Python
# matrix are the ones the source repository's ci.yml defined, run from the
# component directory. The mcp-integration job also runs the application
# tests because apps/aus-accounting-mcp consumes published engines. Root
# policy files and .github changes run every component.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/solomons-sword/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "SECURITY.md"
      - "IMPORTS.md"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - ".mailmap"
  pull_request:
    paths:
      - "packages/solomons-sword/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "SECURITY.md"
      - "IMPORTS.md"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - ".mailmap"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/solomons-sword

jobs:
  test:
    name: pytest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Ruff
        run: uv run --locked --extra dev ruff check louisgoldberg tests
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Typecheck
        run: uv run --locked --extra dev mypy louisgoldberg
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Run tests
        run: uv run --locked --extra dev pytest -q
        env:
          UV_PYTHON: ${{ matrix.python }}

  mcp-integration:
    # The MCP application consumes published engines, so an engine change also
    # runs the application's integration tests.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/aus-accounting-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev pytest -q
        env:
          UV_PYTHON: "3.12"
