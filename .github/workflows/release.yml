name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-python.yml@7095ffd2d03e5068bd57c928c306a99626ca46b8 # post-v0.1.0, adds upload-dist-artifact (#7)
    with:
      version-command: >-
        python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
