name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag whose GitHub Release already has built assets, to
          backfill a PyPI publish for a release that predates the pypi job
          in this workflow. Note: v0.1.3 and earlier cannot be backfilled;
          their metadata pins dependencies by git URL, which PyPI rejects.
          The first PyPI publish should come from a fresh tag instead.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-python.yml@3b8a377207cab2c7c808fcc96b66578f4695beea # release-python.yml's on.workflow_call never re-exposed job outputs; caller PyPI publish silently failed until #11
    with:
      upload-dist-artifact: true
      version-command: >-
        python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"

  pypi:
    if: github.event_name == 'push'
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aus-accounting-mcp
    permissions:
      id-token: write # Obtain the OIDC identity that PyPI trusted publishing verifies.
    steps:
      - name: Download the exact distribution the release job attested
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.release.outputs.stem }}-${{ needs.release.outputs.version }}
          path: dist

      - name: Require exactly one wheel and one source distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -name '*.whl' | wc -l)" = "1"
          test "$(find dist -name '*.tar.gz' | wc -l)" = "1"
          ls -l dist

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  pypi-backfill:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    name: publish an existing release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aus-accounting-mcp
    permissions:
      contents: read
      id-token: write # Obtain the OIDC identity that PyPI trusted publishing verifies.
    steps:
      - name: Download the existing release's attested assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern 'SHA256SUMS'
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS)
          rm dist/SHA256SUMS

      - name: Require exactly one wheel and one source distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -name '*.whl' | wc -l)" = "1"
          test "$(find dist -name '*.tar.gz' | wc -l)" = "1"
          ls -l dist

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
