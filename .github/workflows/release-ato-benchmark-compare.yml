name: Release ato-benchmark-compare

# Component release for packages/ato-benchmark-compare. The namespaced tag
# ato-benchmark-compare/vX.Y.Z selects exactly this component: the reusable
# release-policy workflow binds the tag, the component directory, the
# distribution identity, the RELEASE_NOTES.md header, the lockfile and the
# main commit before it builds, attests and publishes the GitHub release.
# The pypi job then publishes the exact attested distribution through this
# component's own trusted publisher and environment.

on:
  push:
    tags: ["ato-benchmark-compare/v*"]

permissions:
  contents: read

concurrency:
  group: release-ato-benchmark-compare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read # Inspect and download only the exact bound release candidate.
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-python.yml@787db4590e725cfd37104c8a9dd9e75f7fd4c018
    with:
      source-directory: packages/ato-benchmark-compare
      tag-prefix: ato-benchmark-compare
      version-parser: python-literal
      version-file: atobenchmark/__init__.py
      upload-dist-artifact: true

  pypi:
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-ato-benchmark-compare
      url: https://pypi.org/p/ato-benchmark-compare
    permissions:
      id-token: write # Obtain the OIDC identity that PyPI trusted publishing verifies.
    steps:
      - name: Download the exact distribution the release job attested
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.release.outputs.stem }}-${{ needs.release.outputs.version }}
          path: dist

      - name: Require exactly one wheel and one source distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -name '*.whl' | wc -l)" = "1"
          test "$(find dist -name '*.tar.gz' | wc -l)" = "1"
          ls -l dist

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
