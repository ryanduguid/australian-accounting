name: Release payday-super-checker

# Component release for packages/payday-super-checker. The namespaced tag
# payday-super-checker/vX.Y.Z selects exactly this component: the reusable
# release-policy workflow binds the tag, the component directory, the
# distribution identity, the RELEASE_NOTES.md header, the lockfile and the
# main commit before it builds, attests and publishes the GitHub release.
# The pypi job then publishes the exact attested distribution through this
# component's own trusted publisher and environment. The component's own
# bespoke prerelease workflow stays inside its directory as an inert record.

on:
  push:
    tags: ["payday-super-checker/v*"]

permissions:
  contents: read

concurrency:
  group: release-payday-super-checker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read # Inspect and download only the exact bound release candidate.
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-python.yml@3ff09b654a17b9a3b55548e25e6108ee582b00c4
    with:
      source-directory: packages/payday-super-checker
      tag-prefix: payday-super-checker
      upload-dist-artifact: true

  pypi:
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-payday-super-checker
      url: https://pypi.org/p/payday-super-checker
    permissions:
      id-token: write # Obtain the OIDC identity that PyPI trusted publishing verifies.
    steps:
      - name: Download the exact distribution the release job attested
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.release.outputs.stem }}-${{ needs.release.outputs.version }}
          path: dist

      - name: Require exactly one wheel and one source distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -name '*.whl' | wc -l)" = "1"
          test "$(find dist -name '*.tar.gz' | wc -l)" = "1"
          ls -l dist

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
