name: tests

# The repository's anchor workflow. It carries no path filter, so the required
# checks always report, and it runs two things: the MCP application's own gates
# (ruff, pyright, pytest under branch coverage on Python 3.14 and 3.15 plus a Windows
# leg, and a dependency audit, the same set ci-package.yml gives the engines),
# and one call of the reusable ci-package.yml for each engine under packages/.
# Each call applies its own package's path filter, so a change to one engine
# runs that engine's gates and skips the rest.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI follows Python 3.14 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.14"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        run: python3 .github/ci/app_ci.py select aus-accounting-mcp >> "$GITHUB_OUTPUT"

  packages:
    name: ${{ matrix.package }}
    permissions:
      contents: read
      id-token: write # ci-package.yml's codecov job authenticates its upload with OIDC.
    strategy:
      fail-fast: false
      matrix:
        # windows-python names the Python of the Windows leg, and is set where a
        # package already proves its path and codepage handling there.
        # changed-line-coverage lists the risk-scoped files held to complete
        # changed-line branch coverage against main.
        include:
          - package: australian-tax-calculators
            import-name: austaxcalc
            windows-python: "3.14"
            changed-line-coverage: ""
          - package: ato-benchmark-compare
            import-name: atobenchmark
            windows-python: "3.14"
            changed-line-coverage: atobenchmark/mapping.py
          - package: div7a-loan-review
            import-name: div7aloan
            windows-python: ""
            changed-line-coverage: ""
          - package: payday-super-checker
            import-name: paydaysuper
            windows-python: "3.14"
            changed-line-coverage: paydaysuper/assess.py,paydaysuper/report.py
          - package: solomons-sword
            import-name: louisgoldberg
            windows-python: ""
            changed-line-coverage: ""
          - package: the-exchequer-tally
            import-name: edwinnixon
            windows-python: ""
            changed-line-coverage: ""
          - package: the-wip-tally
            import-name: wiptally
            windows-python: "3.14"
            changed-line-coverage: ""
          - package: gst-review
            import-name: gstreview
            windows-python: ""
            changed-line-coverage: ""
    uses: ./.github/workflows/ci-package.yml
    with:
      package: ${{ matrix.package }}
      import-name: ${{ matrix.import-name }}
      windows-python: ${{ matrix.windows-python }}
      changed-line-coverage: ${{ matrix.changed-line-coverage }}

  test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.15"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      # The same branch-coverage gate ci-package.yml runs for the engines, through
      # the pytest-cov the application already pins in its dev extra.
      - name: run tests with branch coverage
        run: uv run --locked --extra dev pytest -q --cov=aus_accounting_mcp --cov-branch --cov-report=term-missing  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/aus-accounting-mcp
        env:
          UV_PYTHON: ${{ matrix.python }}
          # The Codecov leg also writes XML; the documented command stays unchanged.
          PYTEST_ADDOPTS: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && '--cov-report=xml:coverage-codecov.xml' || '' }}
      - name: keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: apps/aus-accounting-mcp/coverage-codecov.xml
          retention-days: 1

  dependency-audit:
    env:
      UV_PYTHON: "3.15"
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/aus-accounting-mcp

  lint:
    env:
      UV_PYTHON: "3.15"
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev ruff check aus_accounting_mcp tests  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/aus-accounting-mcp
      - run: uv run --locked --extra dev pyright aus_accounting_mcp  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/aus-accounting-mcp

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from tests-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true
          flags: aus-accounting-mcp

  tests-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every selected job succeeded and only unselected app jobs skipped,
    # when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [changes, packages, test, dependency-audit, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml tests-gates --no-results --exempt codecov
