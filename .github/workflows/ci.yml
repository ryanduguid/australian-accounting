name: tests

# The repository's anchor workflow. It carries no path filter, so the required
# checks always report, and it runs the MCP application's own gates (ruff, pyright, pytest under branch coverage on Python 3.14 and 3.15 plus a Windows
# leg, and a dependency audit, the same set ci-package.yml gives the engines),
# one call of the reusable ci-package.yml for each Python engine under packages/,
# and one call of ci-rust.yml for each Rust crate. Each ci-package.yml call applies
# its own package's path filter, so a change to one engine runs that engine's
# gates and skips the rest.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI follows Python 3.14 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.14"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        run: python3 .github/ci/app_ci.py select aus-accounting-mcp >> "$GITHUB_OUTPUT"

  packages:
    name: ${{ matrix.package }}
    permissions:
      contents: read
      id-token: write # ci-package.yml's codecov job authenticates its upload with OIDC.
    strategy:
      fail-fast: false
      matrix:
        # windows-python names the Python of the Windows leg, and is set where a
        # package already proves its path and codepage handling there.
        # changed-line-coverage lists the risk-scoped files held to complete
        # changed-line branch coverage against main.
        include:
          - package: lodgment-calendar
            import-name: lodgmentcalendar
            windows-python: ""
            changed-line-coverage: ""
    uses: ./.github/workflows/ci-package.yml
    with:
      package: ${{ matrix.package }}
      import-name: ${{ matrix.import-name }}
      windows-python: ${{ matrix.windows-python }}
      changed-line-coverage: ${{ matrix.changed-line-coverage }}

  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      ci-matrix: ${{ steps.list.outputs.ci-matrix }}
      parity: ${{ steps.list.outputs.parity }}
      parity-count: ${{ steps.list.outputs.parity-count }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: python3 .github/ci/rust_crates.py >> "$GITHUB_OUTPUT"

  # One ci-rust.yml call for each Rust crate: every packages/*/Cargo.toml and
  # apps/*/Cargo.toml, as rust_crates.py lists them, except a crate whose own
  # workflow calls it ([package.metadata.ci] workflow).
  rust:
    name: ${{ matrix.package }}
    needs: crates
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.crates.outputs.ci-matrix) }}
    uses: ./.github/workflows/ci-rust.yml
    with:
      package: ${{ matrix.package }}
      root: ${{ matrix.root }}
      binary: ${{ matrix.binary }}
      smoke: ${{ matrix.smoke }}
    permissions:
      contents: read

  # Each crate had its own caller job until the rust matrix derived them.
  # removed-jobs: exchequer, solomons, wip, taxcalc, div7a, atobench, payday, gst, rates, umbrella

  # Holds au-accounting to each engine's own command on every platform, using
  # the native candidates the jobs above built from this commit.
  umbrella-parity:
    name: au-accounting parity (${{ matrix.os }})
    needs: [crates, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "${{ needs.crates.outputs.parity }}-${{ matrix.os }}"
          path: candidates
          merge-multiple: true
      - name: Unpack the native commands
        shell: bash
        env:
          EXPECTED: ${{ needs.crates.outputs.parity-count }}
        run: |
          set -euo pipefail
          mkdir bin
          for archive in candidates/*; do
            case "$archive" in
              *.zip) 7z x -y -ocandidates "$archive" >/dev/null ;;
              *.tgz) tar -xzf "$archive" -C candidates ;;
            esac
          done
          find candidates -mindepth 2 -type f -exec cp {} bin/ \;
          test "$(ls bin | wc -l)" -eq "$EXPECTED"
      - name: Compare every engine with au-accounting
        run: python -I apps/au-accounting/tests/parity.py bin --cap 600

  test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.15"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      # The same branch-coverage gate ci-package.yml runs for the engines, through
      # the pytest-cov the application already pins in its dev extra.
      - name: run tests with branch coverage
        run: uv run --locked --extra dev pytest -q --cov=aus_accounting_mcp --cov-branch --cov-report=term-missing  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/aus-accounting-mcp
        env:
          UV_PYTHON: ${{ matrix.python }}
          # The Codecov leg also writes XML; the documented command stays unchanged.
          PYTEST_ADDOPTS: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && '--cov-report=xml:coverage-codecov.xml' || '' }}
      - name: keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: apps/aus-accounting-mcp/coverage-codecov.xml
          retention-days: 1

  dependency-audit:
    env:
      UV_PYTHON: "3.15"
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/aus-accounting-mcp

  lint:
    env:
      UV_PYTHON: "3.15"
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev ruff check aus_accounting_mcp tests  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/aus-accounting-mcp
      - run: uv run --locked --extra dev pyright aus_accounting_mcp  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/aus-accounting-mcp

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from tests-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true
          flags: aus-accounting-mcp

  tests-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every selected job succeeded and only unselected app jobs skipped,
    # when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [changes, packages, crates, rust, umbrella-parity, test, dependency-audit, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate aus-accounting-mcp
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml tests-gates --no-results --exempt codecov
