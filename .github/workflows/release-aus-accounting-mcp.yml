name: Release aus-accounting-mcp

# Component release for apps/aus-accounting-mcp. The namespaced tag
# aus-accounting-mcp/vX.Y.Z selects exactly this component: the reusable
# release-policy workflow binds the tag, the component directory, the
# distribution identity, the RELEASE_NOTES.md header, the lockfile and the
# main commit before it builds, attests and publishes the GitHub release.
# The pypi job then publishes the exact attested distribution through this
# component's own trusted publisher and environment, the same shape as the
# six engine release workflows.

on:
  push:
    tags: ["aus-accounting-mcp/v*"]

permissions:
  contents: read

concurrency:
  group: release-aus-accounting-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI and the release policy run the MCP inside the workspace, which redirects
  # every engine to its checked-out source, so neither runs the engines this
  # wheel pins. Install the wheel alone, outside the workspace, so the pins
  # resolve from PyPI, and require its demo to match the checked quick proof.
  published-pins:
    name: demo against the PyPI pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: false
      - name: build the wheel and diff its demo against docs/quick-proof.txt
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir "$RUNNER_TEMP/dist" apps/aus-accounting-mcp
          cd "$RUNNER_TEMP"
          uv venv --python 3.12 pins
          uv pip install --python pins/bin/python dist/*.whl
          pins/bin/aus-accounting-mcp-demo > demo.txt
          diff -u "$GITHUB_WORKSPACE/apps/aus-accounting-mcp/docs/quick-proof.txt" demo.txt

  release:
    needs: published-pins
    permissions:
      actions: read # Inspect and download only the exact bound release candidate.
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-python.yml@ec6b0ee76446f11aefb7fa0c203f2e01b4c9a711
    with:
      required-checks: |
        .github/workflows/no-ai-attribution.yml: Attribution policy / Attribution policy runner
        .github/workflows/ci.yml: dependency-audit
        .github/workflows/ci.yml: lint
        .github/workflows/ci.yml: test (ubuntu-latest, 3.10)
        .github/workflows/ci.yml: test (ubuntu-latest, 3.12)
        .github/workflows/ci.yml: test (ubuntu-latest, 3.13)
        .github/workflows/ci.yml: test (ubuntu-latest, 3.14)
        .github/workflows/ci.yml: test (windows-latest, 3.12)
        .github/workflows/boundaries.yml: boundaries
        .github/workflows/codeql.yml: Analyze Python
        .github/workflows/codeql.yml: codeql-gates
      source-directory: apps/aus-accounting-mcp
      tag-prefix: aus-accounting-mcp
      upload-dist-artifact: true

  pypi:
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-aus-accounting-mcp
      url: https://pypi.org/p/aus-accounting-mcp
    permissions:
      actions: read # Inspect the exact artefact.
      attestations: read # Read the package attestations.
      contents: read # Read the pinned policy.
      id-token: write # Mint the OIDC token PyPI Trusted Publishing verifies.
    steps:
      - name: Check out the policy that built the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ needs.release.outputs.policy-sha }}
          path: policy
          persist-credentials: false

      - name: Verify artefact identity
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_ID: ${{ needs.release.outputs.dist-id }}
          DIST_DIGEST: ${{ needs.release.outputs.dist-digest }}
          STEM: ${{ needs.release.outputs.stem }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIST_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DIST_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DIST_ID" > artifact.json
          jq -e --argjson id "$DIST_ID" --arg digest "sha256:$DIST_DIGEST" \
            --arg name "dist-$STEM-$VERSION" --argjson run "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            '.id == $id and .digest == $digest and .name == $name
             and .expired == false and .workflow_run.id == $run
             and .workflow_run.head_sha == $sha' artifact.json >/dev/null

      - name: Download the bound distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release.outputs.dist-id }}
          path: candidate

      - name: Verify candidate bytes and publication attestations
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ needs.release.outputs.policy-sha }}
          STEM: ${{ needs.release.outputs.stem }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python policy/scripts/python_release.py verify-candidate \
            --directory candidate --stem "$STEM" --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --policy-sha "$POLICY_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          mkdir dist
          for file in "candidate/$STEM-$VERSION-py3-none-any.whl" "candidate/$STEM-$VERSION.tar.gz"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --signer-workflow ryanduguid/release-policy/.github/workflows/release-python.yml \
              --signer-digest "$POLICY_SHA"
            cp "$file" dist/
          done

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
