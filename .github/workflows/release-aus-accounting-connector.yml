name: Release aus-accounting-connector

# On the tag aus-accounting-connector/vX.Y.Z, build the Worker bundle from the
# tagged commit, test that exact bundle, attest it and keep it as a workflow
# artefact. Nothing here deploys: the account owner verifies the attestation and
# deploys the bundle with their own sign-in. No secret or token is referenced.

on:
  push:
    tags: ["aus-accounting-connector/v*"]

permissions:
  contents: read

concurrency:
  group: release-aus-accounting-connector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write # Record the bundle's provenance attestation.
      contents: read
      id-token: write # Obtain the OIDC identity that signs the attestation.
    defaults:
      run:
        shell: bash
        working-directory: tools/aus-accounting-connector
    env:
      WRANGLER_SEND_METRICS: 'false'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Require the tag to name this crate's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          test "$TAG" = "aus-accounting-connector/v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.99 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.99 install worker-build --version 0.8.7 --locked
      - run: npm ci --ignore-scripts
      - name: Build the bundle from the tagged commit
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export AUS_ACCOUNTING_CONNECTOR_COMMIT="$GITHUB_SHA"
          export RUSTUP_TOOLCHAIN=1.99
          worker-build --release
          AUS_ACCOUNTING_CONNECTOR_SERVE_UNTIL=2000-01-01 worker-build --release --out-dir build-expired
      - run: npm test
      - name: Package the tested bundle with its deploy configuration
        run: |
          set -euo pipefail
          name="aus-accounting-connector-$VERSION"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -czf "$RUNNER_TEMP/$name.tar.gz" wrangler.toml build -C ../.. LICENSE NOTICE
          echo "BUNDLE=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.BUNDLE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aus-accounting-connector-${{ env.VERSION }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
          retention-days: 90
