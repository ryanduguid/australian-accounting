name: lodgeit-calculator-adapter

# The optional remote adapter's own gates, in their own workflow rather than in
# ci.yml. Two reasons. The MCP application's guidance test pins ci.yml's command
# list to that component's AGENTS.md, so a second component's commands in the
# same file would make one component's documentation answer for another's. And
# this is the one component that can make a network call, so its gates are worth
# reading on their own.
#
# The suite here is offline. The only sockets it opens are to loopback servers
# the tests start themselves, and tests/no_network_by_default.rs proves the
# adapter sends nothing without being switched on. Nothing in this workflow
# contacts LodgeiT, and upstream availability never gates a build.
#
# The Python package, its pytest, ruff, pyright and pip-audit jobs and its
# Codecov upload were retired when the adapter was ported to Rust.
# removed-jobs: test, lint, dependency-audit, codecov

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lodgeit-calculator-adapter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        run: python3 .github/ci/app_ci.py select lodgeit-calculator-adapter >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    name: lodgeit-adapter
    uses: ./.github/workflows/ci-rust.yml
    with:
      package: lodgeit-calculator-adapter
      root: apps
      binary: lodgeit-adapter
      smoke: contract
    permissions:
      contents: read

  lodgeit-gates:
    needs: [changes, rust]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate lodgeit-calculator-adapter
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci-lodgeit-adapter.yml lodgeit-gates --no-results
