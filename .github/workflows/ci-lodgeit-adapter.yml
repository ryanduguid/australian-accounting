name: lodgeit-calculator-adapter

# The optional remote adapter's own gates, in their own workflow rather than in
# ci.yml. Two reasons. The MCP application's guidance test pins ci.yml's command
# list to that component's AGENTS.md, so a second component's commands in the
# same file would make one component's documentation answer for another's. And
# this is the one component that can make a network call, so its gates are worth
# reading on their own.
#
# The suite here is offline. The only socket it opens is to a http.server on
# loopback that the test starts itself, and tests/test_no_network_by_default.py
# proves the package sends nothing without being switched on. Nothing in this
# workflow contacts LodgeiT, and upstream availability never gates a build.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lodgeit-calculator-adapter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        run: python3 .github/ci/app_ci.py select lodgeit-calculator-adapter >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    name: lodgeit tests (${{ matrix.os }}, ${{ matrix.python }})
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: run tests with branch coverage
        run: uv run --locked --extra dev --extra mcp pytest -q --cov=lodgeitadapter --cov-branch --cov-report=term-missing
        working-directory: apps/lodgeit-calculator-adapter
        env:
          UV_PYTHON: ${{ matrix.python }}

  lint:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    name: lodgeit lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev ruff check lodgeitadapter tests
        working-directory: apps/lodgeit-calculator-adapter
      - run: uv run --locked --extra dev mypy lodgeitadapter
        working-directory: apps/lodgeit-calculator-adapter

  dependency-audit:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    name: lodgeit dependency audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict
        working-directory: apps/lodgeit-calculator-adapter

  lodgeit-gates:
    needs: [changes, test, lint, dependency-audit]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci-lodgeit-adapter.yml lodgeit-gates --no-results
