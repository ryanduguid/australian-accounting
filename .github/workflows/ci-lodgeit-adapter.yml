name: lodgeit-calculator-adapter

# The optional remote adapter's own gates, in their own workflow rather than in
# ci.yml. Two reasons. The MCP application's guidance test pins ci.yml's command
# list to that component's AGENTS.md, so a second component's commands in the
# same file would make one component's documentation answer for another's. And
# this is the one component that can make a network call, so its gates are worth
# reading on their own.
#
# The suite here is offline. The only socket it opens is to a http.server on
# loopback that the test starts itself, and tests/test_no_network_by_default.py
# proves the package sends nothing without being switched on. Nothing in this
# workflow contacts LodgeiT, and upstream availability never gates a build.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lodgeit-calculator-adapter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI follows Python 3.14 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.14"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        run: python3 .github/ci/app_ci.py select lodgeit-calculator-adapter >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    name: lodgeit tests (${{ matrix.os }}, ${{ matrix.python }})
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.15"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: run tests with branch coverage
        run: uv run --locked --extra dev --extra mcp pytest -q --cov=lodgeitadapter --cov-branch --cov-report=term-missing  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/lodgeit-calculator-adapter
        env:
          UV_PYTHON: ${{ matrix.python }}
          # The Codecov leg also writes XML; the documented command stays unchanged.
          PYTEST_ADDOPTS: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && '--cov-report=xml:coverage-codecov.xml' || '' }}
      - name: keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: apps/lodgeit-calculator-adapter/coverage-codecov.xml
          retention-days: 1

  lint:
    env:
      UV_PYTHON: "3.15"
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    name: lodgeit lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev ruff check lodgeitadapter tests  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/lodgeit-calculator-adapter
      - run: uv run --locked --extra dev mypy lodgeitadapter  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/lodgeit-calculator-adapter

  dependency-audit:
    env:
      UV_PYTHON: "3.15"
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    name: lodgeit dependency audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict  # NOSONAR: unprivileged job; uv installs the hash-locked set
        working-directory: apps/lodgeit-calculator-adapter

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from lodgeit-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true
          flags: lodgeit-calculator-adapter

  lodgeit-gates:
    needs: [changes, test, lint, dependency-audit]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci-lodgeit-adapter.yml lodgeit-gates --no-results --exempt codecov
