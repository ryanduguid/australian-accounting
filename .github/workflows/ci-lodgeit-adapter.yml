name: lodgeit-calculator-adapter

# The optional remote adapter's own gates, in their own workflow rather than in
# ci.yml. Two reasons. The MCP application's guidance test pins ci.yml's command
# list to that component's AGENTS.md, so a second component's commands in the
# same file would make one component's documentation answer for another's. And
# this is the one component that can make a network call, so its gates are worth
# reading on their own.
#
# The suite here is offline. The only sockets it opens are to loopback servers
# the tests start themselves, and tests/no_network_by_default.rs proves the
# adapter sends nothing without being switched on. Nothing in this workflow
# contacts LodgeiT, and upstream availability never gates a build.
#
# The Python package, its pytest, ruff, pyright and pip-audit jobs and its
# Codecov upload were retired when the adapter was ported to Rust.
# removed-jobs: test, lint, dependency-audit, codecov

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sundays 21:17 UTC. The Cargo dependency audit also denies unmaintained crates on this run.
    - cron: "17 21 * * 0"
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push to a pull request replaces that pull request's older run.
  # Every other run is keyed on its commit, so a later merge cannot cancel
  # an earlier commit's run on main.
  group: lodgeit-calculator-adapter-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        run: python3 .github/ci/app_ci.py select lodgeit-calculator-adapter >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.run == 'true'
    name: lodgeit-adapter
    uses: ./.github/workflows/ci-rust.yml
    with:
      package: lodgeit-calculator-adapter
      root: apps
      binary: lodgeit-adapter
      smoke: contract
    permissions:
      contents: read

  # The adapter's report from its ci-rust.yml coverage run, under the flag its
  # retired Python upload used.
  codecov-rust:
    name: upload lodgeit-calculator-adapter coverage to Codecov
    needs: rust
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov-rust-lodgeit-calculator-adapter
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          flags: lodgeit-calculator-adapter

  # codecov.yml sets manual_trigger: after this workflow's upload, tell Codecov
  # to post its statuses again with the adapter's report included. Runs only
  # when the upload ran, so a run that uploads nothing never pre-empts ci.yml.
  codecov-notify:
    name: send Codecov statuses after the adapter upload
    needs: codecov-rust
    if: >-
      !cancelled() && needs.codecov-rust.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          run_command: send-notifications
          fail_ci_if_error: true

  lodgeit-gates:
    needs: [changes, rust]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require selected checks to succeed and unselected checks to skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/app_ci.py gate lodgeit-calculator-adapter
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci-lodgeit-adapter.yml lodgeit-gates --no-results --exempt codecov-rust codecov-notify
