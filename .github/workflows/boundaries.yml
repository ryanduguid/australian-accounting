name: boundaries

# Static boundary check for the whole repository: no engine imports the MCP
# application or another engine, and no production module uses a relative
# import that leaves its own package. Standard library only.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: boundaries-${{ github.ref }}
  cancel-in-progress: true

# CI follows Python 3.14 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.14"

jobs:
  boundaries:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m unittest -v tests/test_boundaries.py tests/test_release_checks.py

  root-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv lock --check
      - run: uv run --locked --group dev ruff check .
      - run: uv run --locked --group dev mypy
      - run: uv run --locked --group dev pytest

  # The rates dataset's own checks on the floor and ceiling of its declared Python,
  # as its source repository ran them before the import. They run from a copy outside
  # the workspace, so uv checks the dataset's own uv.lock rather than the root lock;
  # tests/test_components.py runs the same suite inside the workspace.
  rates-dataset:
    name: rates-dataset (${{ matrix.python }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Copy the dataset outside the workspace
        run: cp -R packages/au-tax-rates-data "$RUNNER_TEMP/au-tax-rates-data"
      - run: uv run --locked --no-build pytest -q
        working-directory: ${{ runner.temp }}/au-tax-rates-data
      - run: uv run --locked --no-build python rates.py validate
        working-directory: ${{ runner.temp }}/au-tax-rates-data

  boundaries-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [boundaries, root-checks, rates-dataset]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/boundaries.yml boundaries-gates
