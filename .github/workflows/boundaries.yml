name: boundaries

# Static boundary check for the whole repository: no engine imports the MCP
# application or another engine, and no production module uses a relative
# import that leaves its own package. Standard library only.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m unittest -v tests/test_boundaries.py tests/test_release_checks.py

  root-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv lock --check
      - run: uv run --locked --group dev ruff check .
      - run: uv run --locked --group dev mypy
      - run: uv run --locked --group dev pytest

  boundaries-gates:
    # The one context branch protection requires from this workflow. It runs
    # on every event and fails unless every job it needs succeeded, and its
    # last step fails when a job in this file is missing from needs, so a new
    # job or matrix leg is enforced without a protection change.
    needs: [boundaries, root-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every needed job to succeed
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, value in results.items() if value["result"] != "success"]
          if failed:
              raise SystemExit("Jobs did not succeed: " + ", ".join(failed))
      - name: Check out the workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Require needs to list every other job in this file
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, re
          text = open(".github/workflows/boundaries.yml", encoding="utf-8").read()
          keys = re.findall(r"(?m)^  [\"']?([A-Za-z_][\w-]*)[\"']?:", text.split("\njobs:\n", 1)[1])
          jobs = set(keys)
          if "boundaries-gates" not in jobs:
              raise SystemExit("Could not read the job list; the gate check needs updating")
          missing = sorted(jobs - {"boundaries-gates"} - set(json.loads(os.environ["RESULTS"])))
          if missing:
              raise SystemExit("Add these jobs to needs: " + ", ".join(missing))
