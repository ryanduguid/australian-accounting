name: payday-super-checker

# Component CI for packages/payday-super-checker. The jobs, commands and
# Python matrix are the ones the source repository's ci.yml and verify.yml
# defined, run from the component directory. The mcp-integration job also
# runs the application tests because apps/aus-accounting-mcp consumes this
# engine's published distribution. Root policy files and .github changes run
# every component.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/payday-super-checker/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "SECURITY.md"
      - "IMPORTS.md"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - ".mailmap"
  pull_request:
    paths:
      - "packages/payday-super-checker/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "SECURITY.md"
      - "IMPORTS.md"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - ".mailmap"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/payday-super-checker

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"   # the declared floor
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"   # where path handling can diverge
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev pytest -q
        env:
          UV_PYTHON: ${{ matrix.python }}

  dependency-audit:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict

  package:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev --python 3.12 python -m build
      # The law files ship as package data; a wheel that cannot find them
      # produces a CLI that will not start.
      - name: install the wheel and run it
        run: |
          python -m venv /tmp/venv
          # --no-index, or pip is free to resolve the name from PyPI and
          # test a release nobody built in this job.
          /tmp/venv/bin/pip install --no-index --find-links dist payday-super-checker
          /tmp/venv/bin/payday-super-check examples/sample_payrun.csv \
            -o /tmp/report.csv --as-at 2026-08-10 \
            --confirm-transition-allocation || [ $? -eq 2 ]
          # The import path reads data/profiles/*.json, package data the
          # check path never touches, so a wheel that ships the law files
          # and drops the profiles passes every step above and still cannot
          # import a payroll export. Run both commands of the documented
          # two-command flow, the second against the first's output.
          /tmp/venv/bin/payday-super-check import \
            --payroll tests/fixtures/importers/myob_payroll.csv \
            --super tests/fixtures/importers/myob_super.csv \
            -o /tmp/contributions.csv || [ $? -eq 2 ]
          /tmp/venv/bin/payday-super-check /tmp/contributions.csv \
            -o /tmp/report_from_import.csv --as-at 2026-08-10 \
            --confirm-transition-allocation || [ $? -eq 2 ]
      - name: the shipped tests must pass from the sdist
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && pip install -e ".[dev]" && pytest -q

  lint:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev ruff check paydaysuper tests
      - run: uv run --locked --extra dev mypy paydaysuper

  verify:
    name: verify
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked environment manager
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Lint
        run: uv run --locked --extra dev --python 3.12 ruff check paydaysuper tests

      - name: Typecheck
        run: uv run --locked --extra dev --python 3.12 mypy paydaysuper

      - name: Audit
        run: uv run --locked --extra dev --python 3.12 --with "pip-audit==2.10.1" pip-audit --local --strict

      - name: Run tests with scoped branch coverage
        run: >-
          uv run --locked --extra dev --python 3.12 coverage run --branch
          --source=paydaysuper.assess,paydaysuper.report -m pytest

      - name: Require complete changed-line coverage in assessment logic
        run: |
          uv run --locked --extra dev --python 3.12 coverage xml --include="paydaysuper/assess.py,paydaysuper/report.py" -o coverage.xml
          if git cat-file -e "origin/main:packages/payday-super-checker/paydaysuper/assess.py"; then
            uv run --locked --extra dev --python 3.12 diff-cover coverage.xml --compare-branch=origin/main --branch-coverage --fail-under=100
          else
            echo "::notice::Changed-line coverage starts after the imported package has a mainline baseline."
          fi

  mcp-integration:
    # The MCP application consumes this engine's published distribution, so an
    # engine change also runs the application's integration tests.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/aus-accounting-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev pytest -q
        env:
          UV_PYTHON: "3.12"
