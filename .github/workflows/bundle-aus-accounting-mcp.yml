name: Bundle aus-accounting-mcp

# Claude Desktop MCP Bundle (.mcpb) for an aus-accounting-mcp version already
# released to PyPI. Push aus-accounting-mcp-bundle/vX.Y.Z on the commit tagged
# aus-accounting-mcp/vX.Y.Z once release-aus-accounting-mcp.yml has published
# it. The bundle ships no server source: its uv runtime installs exactly
# aus-accounting-mcp==X.Y.Z from PyPI. Releases here are immutable and the
# component release takes no extra assets, so the bundle gets its own release.
#
# The packer's npm dependencies are not locked, so it runs alone in the pack job,
# whose output is untrusted. The verify job never runs npm: from a fresh checkout
# it binds the tag, requires the PyPI release and checks the packed archive
# against the reviewed source before the release job publishes it.

on:
  push:
    tags: ["aus-accounting-mcp-bundle/v*"]

permissions:
  contents: read

concurrency:
  group: bundle-aus-accounting-mcp-${{ github.ref }}
  cancel-in-progress: false

# CI follows Python 3.14 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.14"
  MCPB_VERSION: "2.1.2"

jobs:
  pack:
    name: validate and pack the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and pack the bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir bundle
          npx --yes --ignore-scripts "@anthropic-ai/mcpb@$MCPB_VERSION" validate apps/aus-accounting-mcp/mcpb/manifest.json
          npx --yes --ignore-scripts "@anthropic-ai/mcpb@$MCPB_VERSION" pack apps/aus-accounting-mcp/mcpb \
            "bundle/aus-accounting-mcp-${GITHUB_REF_NAME#aus-accounting-mcp-bundle/v}.mcpb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed
          path: bundle/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: check the packed bundle and start it
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # Find and download only the artefact the pack job uploaded.
      contents: read
    outputs:
      version: ${{ steps.bind.outputs.version }}
      bundle-sha256: ${{ steps.digest.outputs.sha256 }}
      artifact-id: ${{ steps.artifact.outputs.id }}
      artifact-digest: ${{ steps.artifact.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Bind the tag to the component release and version
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#aus-accounting-mcp-bundle/v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not aus-accounting-mcp-bundle/vX.Y.Z" >&2; exit 1; }
          released="$(git rev-parse --verify "refs/tags/aus-accounting-mcp/v$version^{commit}")" \
            || { echo "there is no aus-accounting-mcp/v$version tag" >&2; exit 1; }
          test "$GITHUB_SHA" = "$released" \
            || { echo "$GITHUB_SHA is not the aus-accounting-mcp/v$version commit $released" >&2; exit 1; }
          test "$(jq -r .version apps/aus-accounting-mcp/mcpb/manifest.json)" = "$version" \
            || { echo "mcpb/manifest.json does not name $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The registry preflight binds pyproject.toml, server.json and the README pins
      # to one version and requires PyPI provenance from this repository's release.
      - name: Require the PyPI release this repository published
        working-directory: apps/aus-accounting-mcp
        run: python scripts/registry_preflight.py
      - name: Find the packed artefact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > artifacts.json
          jq -e '[.artifacts[] | select(.name == "packed")] | length == 1' artifacts.json >/dev/null
          id="$(jq -r '.artifacts[] | select(.name == "packed") | .id' artifacts.json)"
          digest="$(jq -r '.artifacts[] | select(.name == "packed") | .digest' artifacts.json)"
          [[ "$id" =~ ^[1-9][0-9]*$ ]]
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
      - name: Download the packed bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: ${{ runner.temp }}/packed
      # The archive must hold exactly this checkout's mcpb/ files, byte for byte.
      - name: Check the packed files, then start the bundle from PyPI and list its tools
        env:
          VERSION: ${{ steps.bind.outputs.version }}
        run: python -I apps/aus-accounting-mcp/scripts/check_bundle.py "$RUNNER_TEMP/packed/aus-accounting-mcp-$VERSION.mcpb" apps/aus-accounting-mcp/mcpb
      - name: Record the bundle digest
        id: digest
        env:
          VERSION: ${{ steps.bind.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum "$RUNNER_TEMP/packed/aus-accounting-mcp-$VERSION.mcpb" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

  release:
    name: publish the bundle release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Inspect and download only the bundle artefact this run built.
      contents: write # Create the release, upload the bundle and publish it.
    steps:
      - name: Verify artefact identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          jq -e --argjson id "$ARTIFACT_ID" --arg digest "sha256:$ARTIFACT_DIGEST" \
            --argjson run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" \
            '.id == $id and .digest == $digest and .name == "packed"
             and .expired == false and .workflow_run.id == $run
             and .workflow_run.head_sha == $sha' artifact.json >/dev/null
      - name: Download the bound bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: bundle
      # gh creates a draft, uploads the assets, then publishes; the release becomes
      # immutable only once published. A failed upload leaves a draft to delete
      # before a rerun.
      - name: Check the bundle digest and publish its release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          BUNDLE_SHA256: ${{ needs.verify.outputs.bundle-sha256 }}
        shell: bash
        working-directory: bundle
        run: |
          set -euo pipefail
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          file="aus-accounting-mcp-$VERSION.mcpb"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$file" > SHA256SUMS
          sha256sum --check SHA256SUMS
          notes="Claude Desktop MCP Bundle for aus-accounting-mcp $VERSION. Open the .mcpb file with Claude Desktop. The bundle holds no server code: on first launch uv installs aus-accounting-mcp $VERSION from PyPI, the [aus-accounting-mcp/v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/aus-accounting-mcp/v$VERSION) release, and resolves its dependencies. SHA256SUMS checks the download is intact; it does not prove who published it. Not tax, legal or financial advice."
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --latest=false --title "aus-accounting-mcp $VERSION bundle" --notes "$notes" \
            "$file" SHA256SUMS
