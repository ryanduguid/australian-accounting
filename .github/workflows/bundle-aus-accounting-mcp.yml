name: Bundle aus-accounting-mcp

# Claude Desktop MCP Bundle (.mcpb) for an aus-accounting-mcp version already
# released to PyPI. Push aus-accounting-mcp-bundle/vX.Y.Z on a main commit whose
# apps/aus-accounting-mcp version is X.Y.Z after release-aus-accounting-mcp.yml
# has published it. The bundle ships no server source: its uv runtime installs
# exactly aus-accounting-mcp==X.Y.Z from PyPI. Releases here are immutable and
# the component release takes no extra assets, so the bundle gets its own
# release, created as a draft, given its assets, then published.

on:
  push:
    tags: ["aus-accounting-mcp-bundle/v*"]

permissions:
  contents: read

concurrency:
  group: bundle-aus-accounting-mcp-${{ github.ref }}
  cancel-in-progress: false

# CI follows Python 3.14 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.14"
  MCPB_VERSION: "2.1.2"

jobs:
  build:
    name: build and start the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bind.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Bind the tag to main and the component version
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#aus-accounting-mcp-bundle/v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not aus-accounting-mcp-bundle/vX.Y.Z" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }
          test "$(jq -r .version apps/aus-accounting-mcp/mcpb/manifest.json)" = "$version" \
            || { echo "mcpb/manifest.json does not name $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The registry preflight binds pyproject.toml, server.json and the README pins
      # to one version and requires PyPI provenance from this repository's release.
      - name: Require the PyPI release this repository published
        working-directory: apps/aus-accounting-mcp
        run: python scripts/registry_preflight.py
      - name: Validate and pack the bundle
        env:
          VERSION: ${{ steps.bind.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir bundle
          npx --yes --ignore-scripts "@anthropic-ai/mcpb@$MCPB_VERSION" validate apps/aus-accounting-mcp/mcpb/manifest.json
          npx --yes --ignore-scripts "@anthropic-ai/mcpb@$MCPB_VERSION" pack apps/aus-accounting-mcp/mcpb "bundle/aus-accounting-mcp-$VERSION.mcpb"
      - name: Start the packed bundle from PyPI and list its tools
        env:
          VERSION: ${{ steps.bind.outputs.version }}
        run: python -I apps/aus-accounting-mcp/scripts/check_bundle.py "bundle/aus-accounting-mcp-$VERSION.mcpb"
      - name: Record checksums
        working-directory: bundle
        run: sha256sum -- *.mcpb > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish the bundle release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the draft release, upload the bundle and publish it.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - name: Create a draft, upload the bundle, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        working-directory: bundle
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          notes="One-click Claude Desktop install of aus-accounting-mcp $VERSION. Open the .mcpb file with Claude Desktop and confirm the install. Its uv runtime installs aus-accounting-mcp==$VERSION from PyPI, the [aus-accounting-mcp/v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/aus-accounting-mcp/v$VERSION) release. Not tax, legal or financial advice."
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --latest=false --title "aus-accounting-mcp $VERSION bundle" --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "aus-accounting-mcp-$VERSION.mcpb" SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
