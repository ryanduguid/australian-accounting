version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # ADR-0001: the release-policy pin is an immutable full commit SHA,
      # advanced only by a reviewed migration that also updates the pin
      # assertion and verifies attestations against the new signer workflow.
      # Dependabot can do neither, so its bumps are refused by the pin tests
      # and sit red forever. Pin drift is tracked by release-policy's canary
      # audit instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"

  # Python dependency updates stay scoped to one component directory so that
  # no component's lockfile changes because of another component.
  - package-ecosystem: uv
    directory: /apps/aus-accounting-mcp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /packages/ato-benchmark-compare
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /packages/payday-super-checker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python:
        patterns:
