version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # ADR-0001: the release-policy pin is an immutable full commit SHA,
      # advanced only by a reviewed migration that also updates the pin
      # assertion and verifies attestations against the new signer workflow.
      # Dependabot can do neither, so its bumps are refused by the pin tests
      # and sit red forever. Pin drift is tracked by release-policy's canary
      # audit instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"

  # uv resolves all workspace members together. Start at the shared lockfile so
  # an update can change every occurrence of an exact toolchain pin together.
  # Component release locks still need the checks in CONTRIBUTING.md.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python:
        patterns:
          - "*"
