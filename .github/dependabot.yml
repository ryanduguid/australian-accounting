version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # ADR-0001: the release-policy pin is an immutable full commit SHA,
      # advanced only by a reviewed migration that also updates the pin
      # assertion and verifies attestations against the new signer workflow.
      # Dependabot can do neither, so its bumps are refused by the pin tests
      # and sit red forever. Pin drift is tracked by release-policy's canary
      # audit instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"

  # uv resolves all workspace members together. Component release locks still
  # need the checks in CONTRIBUTING.md.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python:
        patterns:
          - "*"
    # Each engine pins the shared toolchain exactly, and the workspace cannot
    # hold two exact pins of one tool. Dependabot rewrites one manifest at a
    # time, so its toolchain updates never resolve (job 1619379035, 9 October
    # 2026). Bump these by hand in every engine at once, as CONTRIBUTING.md
    # describes.
    ignore:
      - dependency-name: build
      - dependency-name: coverage
      - dependency-name: pyright
      - dependency-name: nodejs-wheel-binaries
      - dependency-name: pytest
      - dependency-name: pytest-cov
      - dependency-name: ruff

  - package-ecosystem: cargo
    directories:
      - /packages/the-exchequer-tally
      - /packages/solomons-sword
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      rust:
        patterns: ["*"]
