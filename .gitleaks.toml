# Secret and client-identifier scanning, run by .github/workflows/secrets.yml.
#
# The default gitleaks rules cover credentials. The 4 rules below add the
# identifiers this repository must never hold for a real person or client: a
# tax file number, ABN, bank detail or Medicare number. They are the rules
# australian-accounting-skills runs, anchored on the label rather than the
# digits: an unanchored pattern would match amounts and dates on every other
# line.
#
# A label may be abbreviated or spelled out ('TFN' or 'tax file number') and
# may be joined with underscores, as in a client_tfn or account_number key.
# Keys in camelCase, such as clientTfn or tfnNumber, are not matched.

title = "australian-accounting"

[extend]
useDefault = true

[[rules]]
id = "au-tax-file-number"
description = "Tax file number beside its label"
# 8 or 9 digits, commonly grouped 3-3-3.
regex = '''(?i)(?:\b|_)(?:tfns?|tax[ _-]?file[ _-]?(?:number|no\.?))(?:\b|_)[^0-9\n]{0,20}(\d{3}[ -]?\d{3}[ -]?\d{2,3})\b'''
tags = ["client-data", "australia"]

[[rules]]
id = "au-business-number"
description = "ABN beside its label"
# 11 digits, commonly grouped 2-3-3-3.
regex = '''(?i)(?:\b|_)(?:ab\.?n\.?|australian[ _-]?business[ _-]?number)(?:\b|_)[^0-9\n]{0,20}(\d{2}[ -]?\d{3}[ -]?\d{3}[ -]?\d{3})\b'''
tags = ["client-data", "australia"]

[[rules]]
id = "au-bank-account"
description = "BSB or account number beside its label"
regex = '''(?i)(?:\b|_)(?:bsb|account[\s_-]*(?:number|no\.?))(?:\b|_)[^0-9\n]{0,20}(\d{3}[ -]?\d{3}\b|\d{6,10}\b)'''
tags = ["client-data", "australia"]

[[rules]]
id = "au-medicare-number"
description = "Medicare number beside its label"
regex = '''(?i)(?:\b|_)medicare[\s_-]*(?:number|no\.?|card)(?:\b|_)[^0-9\n]{0,20}(\d{4}[ -]?\d{5}[ -]?\d{1,2})\b'''
tags = ["client-data", "australia"]

[[allowlists]]
description = "Published examples, placeholders and the fixture screen's test data"
targetRules = ["au-tax-file-number", "au-business-number", "au-bank-account", "au-medicare-number"]
paths = [
  # The fixture screen's own tests: synthetic identifiers it must catch.
  '''^tools/fixture-screen/tests/''',
]
regexes = [
  # The ATO's own ABN, the usual published example of a valid ABN.
  '''^51[ -]?824[ -]?753[ -]?556$''',
  # A one-digit change to it, used as an invalid-ABN case.
  '''^51[ -]?824[ -]?753[ -]?557$''',
  # A placeholder ABN of repeated digits that fails the checksum.
  '''^11[ -]?222[ -]?333[ -]?444$''',
  # A placeholder ABN of sequential digits that fails the checksum.
  '''^12[ -]?345[ -]?678[ -]?901$''',
]
