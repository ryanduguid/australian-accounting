# Workspace root. This file is a development entrypoint only: it is not a
# distributable package, carries no version, and ships nothing to PyPI. Each
# component under packages/ and apps/ keeps its own pyproject.toml, version,
# release notes and licence, and is still released on its own from its own
# directory.
#
# The root exists so a fresh clone can install every component and the shared
# toolchain in one command and run the whole suite from the top. See the
# justfile for the setup, lint, typecheck and test entrypoints.

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["packages/the-exchequer-tally", "packages/solomons-sword", "packages/the-wip-tally", "packages/australian-tax-calculators", "packages/div7a-loan-review", "packages/ato-benchmark-compare", "packages/payday-super-checker", "apps/au-accounting", "packages/au-tax-rates-data", "apps/lodgeit-calculator-adapter"]

# The 2 Python engines pin the shared toolchain to one exact version each, so the
# workspace resolves it without an override. Keep those pins identical: a
# workspace resolves every member together, and cannot hold 2 exact pins of
# the same tool.

# apps/aus-accounting-mcp declares exact pins on the 6 engines it consumes,
# because a published distribution cannot depend on a path. Inside the
# workspace gst-review and lodgment-calendar resolve to the checked-out sources
# instead, so the application's tests import gstreview and lodgmentcalendar from
# the tree under review rather than from the last PyPI release.
# The pins stay authoritative for the published wheel; uv sources are development metadata
# and are not written into built distributions.
[tool.uv.sources]
gst-review = { workspace = true }
lodgment-calendar = { workspace = true }

# australian-tax-calculators, div7a-loan-review, ato-benchmark-compare and
# payday-super-checker are now Rust crates outside the workspace. Until the MCP
# server links them directly, it takes each engine's last Python release from
# PyPI (0.2.0, 0.3.2, 0.2.2 and 0.2.2), whose engine code the crates' parity
# corpora pin.

# The shared toolchain for running every component's checks from one
# environment. Components keep their own `dev` extras, which remain the
# authority for their own CI; this group is the union needed to run the whole
# suite from the root. It avoids exact pins: the engines' own extras carry those,
# and the workspace resolution takes the same versions from there.
[dependency-groups]
dev = [
    "build>=1.6.1",
    # No `coverage` entry: `just test` runs pytest uninstrumented, and the
    # engines' coverage gates run through their own `dev` extras, which pin it.
    "holidays>=0.106",
    "jsonschema>=4.0",
    "pyright[nodejs]>=1.1.414",
    "nodejs-wheel-binaries>=24.19.0",
    "openpyxl>=3.1",
    "Pillow>=13.0.0",
    "pytest>=8",
    "ruff>=0.11",
]

# Lint configuration for the files the root owns, which is tests/ and this file.
# Every component keeps its own [tool.ruff] block, and ruff resolves the closest
# one per file, so this does not govern anything under packages/ or apps/.
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["tests"]

[tool.ruff.lint]
# The shared baseline: ruff's default correctness set plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]

# Component suites run in separate processes so their test module names and
# working directories stay independent. The root also keeps its boundary checks.
[tool.pytest.ini_options]
testpaths = ["tests"]

# Runtime packages only. Components retain their own configuration and CI gates.
[tool.pyright]
pythonVersion = "3.14"
include = [
    "packages/gst-review/gstreview",
    "packages/lodgment-calendar/lodgmentcalendar",
    "apps/aus-accounting-mcp/aus_accounting_mcp",
]
extraPaths = [
    "packages/gst-review",
    "packages/lodgment-calendar",
    "apps/aus-accounting-mcp",
]
typeCheckingMode = "standard"
reportMissingImports = "none"
