[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aus-accounting-mcp"
version = "0.1.5"
description = "MCP facade over payday-super-checker and ato-benchmark-compare. uvx from PyPI; citations and refusals, not advice."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "model-context-protocol",
    "mcp-server",
    "australian-tax",
    "ato-benchmarks",
    "payday-super",
    "accounting-ai",
]
dependencies = [
    "mcp>=2.0.0,<3",
    # Exact pins, same intent as the commit pins these replace. PyPI rejects a
    # distribution whose metadata carries a direct URL reference, so a git pin
    # here makes the package unpublishable.
    "payday-super-checker==0.1.2",
    "ato-benchmark-compare==0.1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14",
    "build>=1.2",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
aus-accounting-mcp = "aus_accounting_mcp.cli:main"

[project.urls]
Homepage = "https://ryanduguid.github.io/tools/australian-tax-ai-agents/"
Repository = "https://github.com/ryanduguid/au-tax-mcp-server.git"

[tool.hatch.build.targets.wheel]
packages = ["aus_accounting_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["aus_accounting_mcp", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["aus_accounting_mcp"]
ignore_missing_imports = true
pretty = true
