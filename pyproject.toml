[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aus-accounting-mcp"
version = "0.1.0"
description = "MCP facade over payday-super-checker and ato-benchmark-compare. uvx from GitHub; citations and refusals, not advice."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "model-context-protocol",
    "mcp-server",
    "australian-tax",
    "ato-benchmarks",
    "payday-super",
    "accounting-ai",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "payday-super-checker @ git+https://github.com/ryanduguid/payday-super-checker.git@4e60756de85cb0d06aa9c5ca2c4193b72a5802a3",
    "ato-benchmark-compare @ git+https://github.com/ryanduguid/ato-benchmark-compare.git@64e165378d1cebb55d611f3675894c0630120f34",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
aus-accounting-mcp = "aus_accounting_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ryanduguid/au-tax-mcp-server"
Repository = "https://github.com/ryanduguid/au-tax-mcp-server.git"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["aus_accounting_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
src = ["aus_accounting_mcp", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["aus_accounting_mcp"]
ignore_missing_imports = true
pretty = true

